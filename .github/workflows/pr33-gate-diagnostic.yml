name: pr33-gate-diagnostic

# PROPOSED (PR33 evidence16 107-case diagnostic003, derived from the executed diagnostic002 workflow of control af0005d6 on source f8a5ca60; this new proposal is unrun), NOT RUN, NOT PARSED. DIAGNOSTIC-ONLY control workflow for the single
# branch diagnostic/pr33-gate-003. It never merges into the product branch and does not alter .github/workflows/ci.yml. Trigger: a push to that exact branch
# ONLY (no pull_request, schedule, workflow_dispatch, repository_dispatch, tags or wildcard). GITHUB_SHA is the CONTROL commit; the tested SOURCE commit
# (the local evidence16 source child 8ae52226..., sole parent f8a5ca60..., reachable remotely only as the control's ancestor) is pinned literally below.
# Order: pre -> dbprobe -> build -> bind-build -> test -> post -> validate (verdict written) -> collect -> upload -> outcome-only gate. A setup, probe, build
# or binding failure prevents the test from launching (no retry); post, validate and collect still run whenever the pre step ran, so the evidence stays
# collectable. The upload runs only when `collect` has published the fixed output upload_ready=true, which it does only after verifying ownership of the
# capture root and exclusively creating the fresh upload directory; a collection failure after that point still uploads the partial snapshot, but the
# final gate requires every step (collect included) to succeed, and a failing test case keeps the TEST step red and therefore the job red.
# `always()` does NOT override cancellation or the job deadline: a cancelled run or a lost runner may leave the evidence incomplete, which is HOLD.

on:
  push:
    branches: [diagnostic/pr33-gate-003]

permissions:
  contents: read

concurrency:
  group: pr33-gate-diagnostic
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: the_desk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d the_desk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/the_desk_test
    steps:
      - name: Check out the CONTROL commit (GITHUB_SHA), no persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          path: pr33-gate-control
          persist-credentials: false
          fetch-depth: 1
      - name: Check out the tested SOURCE commit by literal SHA, no persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          ref: 8ae5222680da01fc9d6c0b5ee406da64c8f6b2d0
          path: pr33-gate-target
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 2
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: npm install --global npm@11.19.0 --ignore-scripts
        timeout-minutes: 3
      - name: Install the exact locked dependencies in the target checkout (no lifecycle scripts)
        run: npm ci --ignore-scripts
        working-directory: pr33-gate-target
        timeout-minutes: 5
      - name: Bind source, control, tools and identities before anything runs
        id: pre
        run: /usr/bin/python3 -I -B pr33-gate-control/diagnostic/pr33-gate/gate_bind.py pre
        timeout-minutes: 3
      - name: Probe the disposable database (the existing read-only probe)
        id: dbprobe
        run: /usr/bin/python3 -I -B pr33-gate-control/diagnostic/pr33-gate/gate_bind.py dbprobe
        timeout-minutes: 1
      - name: Build the target (the existing build command)
        id: build
        run: npm run build
        working-directory: pr33-gate-target
        timeout-minutes: 5
      - name: Bind the emitted build and re-bind source, control and tools before the test
        id: bindbuild
        run: /usr/bin/python3 -I -B pr33-gate-control/diagnostic/pr33-gate/gate_bind.py bind-build
        timeout-minutes: 3
      - name: Run the three selected files (107 cases) under the derived containment guard
        id: test
        run: /bin/bash pr33-gate-control/diagnostic/pr33-gate/run-gate.sh
        timeout-minutes: 8
      - name: Re-bind source, control, tools and dist after the test (also after a failing test)
        id: post
        if: ${{ always() && steps.pre.outcome == 'success' && steps.bindbuild.outcome == 'success' }}
        run: /usr/bin/python3 -I -B pr33-gate-control/diagnostic/pr33-gate/gate_bind.py post
        timeout-minutes: 3
      - name: Validate and write the diagnostic verdict before collection
        id: validate
        if: ${{ always() && steps.pre.outcome != 'skipped' }}
        run: /usr/bin/python3 -I -B pr33-gate-control/diagnostic/pr33-gate/gate_bind.py validate
        timeout-minutes: 2
      - name: Collect the verdict and the exact raw records into the upload snapshot
        id: collect
        if: ${{ always() && steps.pre.outcome != 'skipped' }}
        run: /usr/bin/python3 -I -B pr33-gate-control/diagnostic/pr33-gate/gate_bind.py collect
        timeout-minutes: 3
      - name: Retain the diagnostic evidence (complete or partial)
        id: upload
        if: ${{ always() && steps.collect.outputs.upload_ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 2
        with:
          name: pr33-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/g33/u
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Outcome-only job gate (three selected files, 107 cases only)
        if: ${{ always() }}
        shell: bash
        timeout-minutes: 1
        env:
          PRE: ${{ steps.pre.outcome }}
          DBPROBE: ${{ steps.dbprobe.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BINDBUILD: ${{ steps.bindbuild.outcome }}
          TEST: ${{ steps.test.outcome }}
          POST: ${{ steps.post.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          COLLECT: ${{ steps.collect.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
        run: |
          echo "pre=$PRE dbprobe=$DBPROBE build=$BUILD bindbuild=$BINDBUILD test=$TEST post=$POST validate=$VALIDATE collect=$COLLECT upload=$UPLOAD"
          [ "$PRE" = success ] && [ "$DBPROBE" = success ] && [ "$BUILD" = success ] && [ "$BINDBUILD" = success ] && [ "$TEST" = success ] && [ "$POST" = success ] && [ "$VALIDATE" = success ] && [ "$COLLECT" = success ] && [ "$UPLOAD" = success ] || { echo "HOLD: not every stage succeeded (a failing test case keeps the test stage, and so this job, failed)"; exit 1; }
          echo "all stages succeeded: all 107 cases passed, evidence collected and uploaded (three selected files only; not a 74-file or full-CI pass)"
