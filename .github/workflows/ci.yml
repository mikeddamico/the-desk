        if: ${{ always() && steps.init.outcome == 'success' && (steps.fixture046-runtime.outcome == 'success' || steps.fixture046-runtime.outcome == 'failure') }}
        working-directory: /tmp/e
        timeout-minutes: 2
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/evaluation
        run: /usr/bin/python3 -I -B test/support/fixture046-ffmpeg-supply.py cleanup
      - name: Collect full evidence
        id: collect-full
        if: ${{ always() && steps.init.outcome == 'success' }}
        working-directory: /tmp/e
        timeout-minutes: 3
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/evaluation
          FIXTURE046_CLEANUP_OUTCOME: ${{ steps.fixture046-cleanup.outcome }}
        run: |
          /usr/bin/python3 -I -B tools/ci-validation/ci.py collect --scope full
      - name: Retain full evidence
        id: upload-full
        if: ${{ always() && steps.collect-full.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 3
        with:
          name: ci-full-rest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evaluation/ci/upload-full
          if-no-files-found: error
          retention-days: 30
      - name: Collect known producer failure or partial evidence
        id: collect-producer
        if: ${{ always() && steps.build-layout.outcome != 'skipped' }}
        working-directory: ${{ github.workspace }}
        timeout-minutes: 3
        run: |
          /usr/bin/python3 -I -B tools/ci-validation/ci.py retain-producer-partial
      - name: Retain both producer roles including partial failures
        id: upload-producer
        if: ${{ always() && steps.collect-producer.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 3
        with:
          name: ci-producers-rest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/producer-failure
          if-no-files-found: error
          retention-days: 30
      - name: Audit complete locked BUILD dependencies
        id: audit
        if: ${{ success() && steps.init.outcome == 'success' }}
        working-directory: /tmp/d
        timeout-minutes: 5
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/build
        run: |
          npm audit --audit-level=high
      - name: Bind the original workspace before the security scan
        id: security-precheck
        if: ${{ success() && steps.init.outcome == 'success' }}
        working-directory: /tmp/e
        timeout-minutes: 2
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/evaluation
        run: /usr/bin/python3 -I -B tools/ci-validation/ci.py security-precheck
      - id: gitleaks
        if: ${{ success() && steps.security-precheck.outcome == 'success' }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: Retain security report
        id: retain-security
        if: ${{ always() && steps.init.outcome == 'success' && steps.security-precheck.outcome == 'success' && (steps.gitleaks.outcome == 'success' || steps.gitleaks.outcome == 'failure') }}
        working-directory: /tmp/e
        timeout-minutes: 1
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/evaluation
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
        run: |
          /usr/bin/python3 -I -B tools/ci-validation/ci.py retain-security
      - name: Upload partition security report
        id: upload-security
        if: ${{ always() && steps.retain-security.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 2
        with:
          name: ci-security-rest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evaluation/ci/security-report
          if-no-files-found: error
          retention-days: 30
      - name: Require complete partition and retained security proof
        id: final
        if: ${{ always() && steps.init.outcome == 'success' }}
        working-directory: /tmp/e
        timeout-minutes: 3
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/evaluation
          PRODUCER_UPLOAD_OUTCOME: ${{ steps.upload-producer.outcome }}
          CONTROLS_UPLOAD_OUTCOME: ${{ steps.upload-controls.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload-full.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
          SECURITY_UPLOAD_OUTCOME: ${{ steps.upload-security.outcome }}
          FIXTURE046_CLEANUP_OUTCOME: ${{ steps.fixture046-cleanup.outcome }}
        run: |
          /usr/bin/python3 -I -B tools/ci-validation/ci.py final

  verify:
    needs: [verify-writer, verify-rest, container]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every isolated job
        env:
          WRITER_OUTCOME: ${{ needs.verify-writer.result }}
          REST_OUTCOME: ${{ needs.verify-rest.result }}
          CONTAINER_OUTCOME: ${{ needs.container.result }}
        run: |
          test "$WRITER_OUTCOME" = success
          test "$REST_OUTCOME" = success
          test "$CONTAINER_OUTCOME" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with: { fetch-depth: 0 }
      - name: Prove the complete disjoint test population
        run: /usr/bin/python3 -I -B tools/ci-validation/ci.py joint
        timeout-minutes: 2
        env:
          WRITER_PROOF: ${{ needs.verify-writer.outputs.proof }}
          REST_PROOF: ${{ needs.verify-rest.outputs.proof }}
          WRITER_OUTCOME: ${{ needs.verify-writer.result }}
          REST_OUTCOME: ${{ needs.verify-rest.result }}
          CONTAINER_OUTCOME: ${{ needs.container.result }}

  container:
    needs: [verify-maintenance-fixture105]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
      - run: docker build --tag the-desk:${GITHUB_SHA} --build-arg DEPLOYED_COMMIT=${GITHUB_SHA} .
        timeout-minutes: 25
