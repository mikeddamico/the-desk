          def git(*args):
              return subprocess.check_output(['/usr/bin/git', *args], timeout=15)

          def snapshot():
              paths = git('ls-files', '-z').split(b'\0')[:-1]
              rows = []
              for raw in paths:
                  path = Path(os.fsdecode(raw))
                  require(path.is_file() and not path.is_symlink(), 'regular tracked source required')
                  data = path.read_bytes()
                  rows.append({'path': str(path), 'bytes': len(data),
                               'sha256': hashlib.sha256(data).hexdigest()})
              return {'head': git('rev-parse', 'HEAD').decode().strip(),
                      'tree': git('rev-parse', 'HEAD^{tree}').decode().strip(),
                      'status': git('status', '--porcelain', '--untracked-files=all').decode(),
