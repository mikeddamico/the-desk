              receipt = {'schema': 'synthetic-owner-preflight/2', 'accepted': error is None,
                         'full_acceptance': False, 'production_fixture_evidence': False,
                         'path_substituted': True, 'verifier_sha256': VERIFIER_SHA256,
                         'case_passed': {name: CASE_PASSED.get(name) is True for name in CASES},
                         'synthetic_pins': safe_pins,
                         'case_population': len(CASES),
