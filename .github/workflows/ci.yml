name: foundation-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: the_desk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d the_desk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/the_desk_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm install --global npm@11.19.0 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Locate P33 evidence
        id: p33-evidence
        run: |
          /usr/bin/python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import hashlib, os, pathlib, tempfile
          key = hashlib.sha256(str(pathlib.Path.cwd().resolve()).encode()).hexdigest()[:24]
          print(f"path={tempfile.gettempdir()}/the-desk-p33-{os.getuid()}-{key}/attempt-*/**/*.json")
          PYTHON
      - name: Verify P33 process prerequisites
        run: npm run test:p33:prerequisite
      - name: Verify P33 contained deadline handling
        run: npm run test:p33:harness
      - name: Retain P33 controls evidence
        if: ${{ always() && steps.p33-evidence.outputs.path != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p33-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.p33-evidence.outputs.path }}
          if-no-files-found: error
          retention-days: 30
      - run: npm run test:all
      - name: Retain P33 full evidence
        if: ${{ always() && steps.p33-evidence.outputs.path != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p33-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.p33-evidence.outputs.path }}
          if-no-files-found: error
          retention-days: 30
      - run: npm audit --audit-level=high
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag the-desk:${GITHUB_SHA} --build-arg DEPLOYED_COMMIT=${GITHUB_SHA} .
