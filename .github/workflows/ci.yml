                         'actual_docker_uid_zero': CASE_PASSED.get('genuine_docker_ten') is True,
                         'runner_retained_role_matches': CASE_PASSED.get('genuine_runner_retained_ten') is True,
                         'cleanup_verified': container_cleanup_verified and filesystem_cleanup_verified,
                         'container_cleanup_verified': container_cleanup_verified,
                         'filesystem_cleanup_verified': filesystem_cleanup_verified,
                         'work_failure_phase': work_failure_phase, 'work_failure_kind': work_failure_kind,
                         'cleanup_failure_phase': cleanup_failure_phase,
                         'failure_case': LAST_CASE if work_failure_phase in ('case_setup', 'case_check', 'case_restore')
                             and LAST_CASE in CASES else None,
                         'failure_code': None if error is None else
                             (error.code if type(error) is PreflightFailure and error.code in CODES else 'internal')}
              data = (json.dumps(receipt, sort_keys=True) + '\n').encode()
              need(len(data) <= 16384, 'internal')
              fd = os.open(base / 'synthetic-owner-preflight.json', os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
              try:
