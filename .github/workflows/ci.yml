name: foundation-ci

# FULL RESTORATION: independent ordinary installations and complete partition acceptance.
# CI153 revised selected-case proof accepted; original 120-second benchmark remains failed.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-maintenance-fixture105:
    runs-on: ubuntu-24.04
    timeout-minutes: 190
    services:
      postgres:
        image: postgres:17
        command: postgres -c autovacuum=off
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: the_desk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d the_desk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DESK_CI_PARTITION: rest
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/the_desk_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with: { fetch-depth: 0 }
      - name: Run unchanged installation unit controls on the genuine hosted runner
        id: installation-unit-controls
        env:
          PREFLIGHT_SERVICE_CONTAINER: ${{ job.services.postgres.id }}
        if: ${{ success() }}
        working-directory: ${{ github.workspace }}
        timeout-minutes: 4
        run: |
          /usr/bin/timeout --signal=TERM --kill-after=5s 180s /usr/bin/python3 -I -B - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          """Temporary hosted synthetic owner preflight; embedded verbatim, not tracked code."""
          import ast
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          import re
          import resource
          import stat
          import signal
          import errno
          import subprocess
          import sys
          import time
          import types
          import uuid

          VERIFIER_SHA256 = 'a59bd51fe00ca3f24142da5b65e12b6c2e6e0d012bfa8b0885c6bea1832e3ab5'
          CODES = frozenset(('context', 'extract', 'identity', 'deadline', 'command', 'command_uncertain',
                             'container', 'mapping', 'case', 'cleanup', 'internal'))
          CASES = ('genuine_docker_ten', 'genuine_runner_retained_ten', 'runner_docker_rejected',
                   'root_host_rejected', 'root_retained_rejected', 'outside_root_rejected',
                   'unsettled_rejected', 'terminal_identity', 'symlink_rejected', 'hardlink_rejected',
                   'fifo_rejected', 'permissions_rejected', 'bound_rejected', 'missing_rejected',
                   'unknown_rejected', 'copy_drift_rejected', 'duplicate_json_rejected',
                   'malformed_json_rejected', 'leaf_replacement_rejected', 'root_replacement_rejected',
                   'root_owned_directory_rejected', 'settlement_rejected', 'settlement_admitted',
                   'cleanup_receipt_replacement_rejected', 'original_byte_drift_rejected')

          LAST_CASE = None
          SYNTHETIC_PINS = {}
          CASE_PASSED = {name: False for name in CASES}
          PHASES = frozenset(('extract', 'setup', 'image', 'producer', 'runner_copies',
              'case_setup', 'case_check', 'case_restore', 'pin_validation',
              'container_cleanup', 'filesystem_cleanup', 'receipt', 'unknown'))
          ACTIVE_PHASE = 'unknown'


          class PreflightFailure(RuntimeError):
              def __init__(self, code):
                  self.code = code if type(code) is str and code in CODES else 'internal'
                  super().__init__(self.code)


          def need(value, code):
              if not value:
                  raise PreflightFailure(code)


          def phase(value):
              global ACTIVE_PHASE
              need(type(value) is str and value in PHASES, 'internal')
              ACTIVE_PHASE = value


          def case_setup(name):
              global LAST_CASE
              need(type(name) is str and name in CASES, 'internal')
              LAST_CASE = name
              phase('case_setup')


          def failure_kind(error):
              if type(error) is PermissionError and error.errno in (errno.EACCES, errno.EPERM):
                  return 'permission_denied'
              if type(error) is FileNotFoundError:
                  return 'missing'
              if type(error) is PreflightFailure:
                  return 'verification'
              return 'other'


          def load_module(name, path):
              spec = importlib.util.spec_from_file_location(name, path)
              module = importlib.util.module_from_spec(spec)
              sys.modules[name] = module
              spec.loader.exec_module(module)
              return module


          def extract_verifier(workflow):
              start = '          """Temporary read-only native verifier;'
              text = workflow.read_text()
              marker = '\n' + start
              need(text.count(marker) == 1, 'extract')
              body = text[text.index(marker) + 1:].split('          PY\n', 1)[0]
              need(all(not line.strip() or line.startswith('          ') for line in body.splitlines()), 'extract')
              source = ''.join(line[10:] if line.strip() else line for line in body.splitlines(True))
              need(hashlib.sha256(source.encode()).hexdigest() == VERIFIER_SHA256, 'extract')
              namespace = {'__name__': 'synthetic_owner_preflight_verifier'}
              exec(compile(ast.parse(source), '<reviewed synthetic verifier>', 'exec'), namespace)
              return namespace


          class DockerProbe:
              """One named owned container; cleanup time reserved even on earlier failure."""
              def __init__(self, base, clock=time.monotonic):
                  self.base, self.clock = base, clock
                  self.started = clock()
                  self.work_deadline = self.started + 30
                  self.deadline = self.started + 45
                  self.token = uuid.uuid4().hex
                  self.name = 'desk-owner-preflight-' + self.token
                  self.identifier = None
                  self.created_pending = False
                  self.uncertain = False
                  self.counter = 0
                  self.service_volumes = set()
                  self.existing_volumes = set()
                  self.declared_volumes = set()
                  self.volumes = set()
                  self.bind_root = None
                  self.mounts_admitted = False
                  self.environment = {'PATH': '/usr/bin:/bin', 'LANG': 'C', 'LC_ALL': 'C',
                                      'HOME': str(base)}

              def command(self, args, cleanup=False):
                  deadline = self.deadline if cleanup else self.work_deadline
                  remaining = deadline - self.clock()
                  # Reserve a second for reaping, including in cleanup commands.
                  need(remaining > 1.2, 'deadline')
                  self.counter += 1
                  # Anonymous inode: even failed cleanup cannot upload private Docker payloads.
                  fd = os.open(self.base, os.O_RDWR | os.O_TMPFILE | os.O_CLOEXEC, 0o600)
                  process = None
                  def limit():
                      resource.setrlimit(resource.RLIMIT_FSIZE, (4096, 4096))
                  try:
                      process = subprocess.Popen(['/usr/bin/docker', '--host=unix:///var/run/docker.sock'] + args,
                          stdin=subprocess.DEVNULL, stdout=fd, stderr=subprocess.DEVNULL,
                          env=self.environment, preexec_fn=limit)
                      try:
                          code = process.wait(timeout=min(5, remaining - 1))
                      except BaseException:
                          self.uncertain = True
                          try:
                              process.kill()
                          except BaseException:
                              self.uncertain = True
                          try:
                              process.wait(timeout=min(1, max(0.01, deadline - self.clock())))
                          except BaseException:
                              self.uncertain = True
                          raise PreflightFailure('command_uncertain') from None
                      need(code == 0, 'command')
                      info = os.fstat(fd)
                      need(stat.S_ISREG(info.st_mode) and info.st_uid == os.getuid()
                           and info.st_nlink == 0 and stat.S_IMODE(info.st_mode) == 0o600
                           and info.st_size <= 4096, 'command')
                      os.lseek(fd, 0, os.SEEK_SET)
                      data = os.read(fd, 4097)
                      need(len(data) == info.st_size, 'command')
                  finally:
                      os.close(fd)
                  need(len(data) <= 4096 and self.clock() < deadline, 'command')
                  return data.decode('ascii', errors='strict').strip()

              def image(self, service):
                  need(type(service) is str and re.fullmatch(r'[0-9a-f]{64}', service), 'identity')
                  image = self.command(['inspect', '--format', '{{.Image}}', service])
                  need(re.fullmatch(r'sha256:[0-9a-f]{64}', image), 'identity')
                  user = self.command(['image', 'inspect', '--format', '{{json .Config.User}}', image])
                  need(user in ('""', '"0"', '"root"'), 'mapping')
                  mounts = json.loads(self.command(['inspect', '--format', '{{json .Mounts}}', service]))
                  need(type(mounts) is list and len(mounts) <= 8, 'identity')
                  self.service_volumes = {row['Name'] for row in mounts if type(row) is dict and row.get('Type') == 'volume'}
                  declarations = json.loads(self.command(['image', 'inspect', '--format', '{{json .Config.Volumes}}', image]))
                  need(declarations is None or (type(declarations) is dict and len(declarations) <= 4
                       and all(type(name) is str and name.startswith('/') and len(name) <= 256
                               for name in declarations)), 'identity')
                  self.declared_volumes = set(declarations or {})
                  names = self.command(['volume', 'ls', '--format', '{{.Name}}']).splitlines()
                  need(len(names) <= 64 and all(re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_.-]{0,127}', name)
                                              for name in names), 'identity')
                  self.existing_volumes = set(names)
                  need(self.service_volumes <= self.existing_volumes, 'identity')
                  return image

              def produce(self, root, names, image):
                  # Exact fixed names originate only from the reviewed verifier literal.
                  need(len(names) == 10 and all(re.fullmatch(r'[a-z.-]+', name) for name in names), 'identity')
                  script = ('set -eu; umask 022; for name in ' + ' '.join(names) +
                            '; do printf "synthetic-owner\\n" > "/evidence/$name"; done; '
                            'printf "{}\\n" > /evidence/negative/host; '
                            'printf "synthetic-owner\\n" > /evidence/negative/retained; '
                            'umask 000; mkdir -m 0777 /evidence/negative/root-directory')
                  self.bind_root = str(root)
                  self.created_pending = True
                  identifier = self.command(['create', '--name', self.name,
                      '--label', 'desk.owner-preflight=' + self.token, '--pull=never',
                      '--network=none', '--read-only', '--security-opt=no-new-privileges',
                      '--pids-limit=16', '--memory=64m', '--cpus=0.5',
                      '--mount', 'type=bind,src=' + str(root) + ',dst=/evidence',
                      '--entrypoint=/bin/sh', image, '-c', script])
                  need(re.fullmatch(r'[0-9a-f]{64}', identifier), 'identity')
                  self.identifier = identifier
                  self.command(['start', self.identifier])
                  need(self.command(['wait', self.identifier]) == '0', 'container')
                  observed = self.command(['inspect', '--format',
                      '{{.Id}}|{{index .Config.Labels "desk.owner-preflight"}}|{{.State.Running}}|{{.State.ExitCode}}|{{.Image}}',
                      self.identifier])
                  need(observed == self.identifier + '|' + self.token + '|false|0|' + image, 'container')
                  self.cleanup()

              def cleanup(self):
                  if not self.created_pending:
                      return
                  # Find by exact reserved name AND independent token; never remove a service.
                  population = self.command(['container', 'ls', '--all', '--no-trunc',
                      '--filter', 'name=^/' + self.name + '$', '--filter', 'label=desk.owner-preflight=' + self.token,
                      '--format', '{{.ID}}'], cleanup=True)
                  rows = population.splitlines() if population else []
                  need(len(rows) <= 1 and all(re.fullmatch(r'[0-9a-f]{64}', row) for row in rows), 'cleanup')
                  if rows:
                      identifier = rows[0]
                      need(self.identifier is None or self.identifier == identifier, 'cleanup')
                      observed = self.command(['inspect', '--format',
                          '{{.Id}}|{{index .Config.Labels "desk.owner-preflight"}}', identifier], cleanup=True)
                      need(observed == identifier + '|' + self.token, 'cleanup')
                      mounts = json.loads(self.command(['inspect', '--format', '{{json .Mounts}}', identifier], cleanup=True))
                      need(type(mounts) is list and 1 <= len(mounts) <= 5, 'cleanup')
                      bind = [row for row in mounts if type(row) is dict and row.get('Type') == 'bind']
                      volumes = [row for row in mounts if type(row) is dict and row.get('Type') == 'volume']
                      need(len(bind) == 1 and len(bind) + len(volumes) == len(mounts)
                           and bind[0].get('Source') == self.bind_root and bind[0].get('Destination') == '/evidence'
                           and bind[0].get('RW') is True and len(volumes) == len(self.declared_volumes)
                           and {row.get('Destination') for row in volumes} == self.declared_volumes, 'cleanup')
                      names = {row.get('Name') for row in volumes}
                      need(len(names) == len(volumes) and all(type(name) is str and
                           re.fullmatch(r'[0-9a-f]{64}', name) and name not in self.service_volumes
                           and name not in self.existing_volumes for name in names), 'cleanup')
                      need(not self.volumes or self.volumes == names, 'cleanup')
                      self.volumes = names
                      self.mounts_admitted = True
                      self.command(['rm', '--force', '--volumes', identifier], cleanup=True)
                  need(bool(rows) or self.mounts_admitted, 'cleanup')
                  # Name-only check rejects a conflicting/unknown leftover rather than ignoring it.
                  remaining = self.command(['container', 'ls', '--all', '--no-trunc',
                      '--filter', 'name=^/' + self.name + '$', '--format', '{{.ID}}'], cleanup=True)
                  need(remaining == '', 'cleanup')
                  for name in sorted(self.volumes):
                      need(self.command(['volume', 'ls', '--filter', 'name=' + name,
                                         '--format', '{{.Name}}'], cleanup=True) == '', 'cleanup')
                  need(not self.uncertain, 'cleanup')
                  self.created_pending = False


          class SyntheticRoots:
              def __init__(self, base):
                  self.paths = (base / 'synthetic-root', base / 'synthetic-root-old',
                                base / 'synthetic-root-replacement')
                  need(not any(os.path.lexists(path) for path in self.paths), 'cleanup')
                  self.admitted = {}

              def admit(self, path, empty=False):
                  info = path.lstat()
                  need(stat.S_ISDIR(info.st_mode) and
                       ((info.st_uid == 0 and empty) or
                        (info.st_uid == os.getuid() and stat.S_IMODE(info.st_mode) == 0o700)), 'cleanup')
                  identity = (info.st_dev, info.st_ino, info.st_uid)
                  self.admitted[identity] = empty
                  return identity

              def create(self, path):
                  need(path in self.paths and not os.path.lexists(path), 'cleanup')
                  # Defer termination only across exclusive creation + identity registration.
                  mask = signal.pthread_sigmask(signal.SIG_BLOCK, {signal.SIGTERM, signal.SIGINT})
                  try:
                      path.mkdir(mode=0o700)
                      return self.admit(path)
                  finally:
                      signal.pthread_sigmask(signal.SIG_SETMASK, mask)

              def move(self, source, destination):
                  info = source.lstat()
                  identity = (info.st_dev, info.st_ino, info.st_uid)
                  need(identity in self.admitted and destination in self.paths
                       and not os.path.lexists(destination), 'cleanup')
                  source.rename(destination)
                  info = destination.lstat()
                  need((info.st_dev, info.st_ino, info.st_uid) == identity, 'cleanup')

              def cleanup(self, owner, deadline):
                  for path in self.paths:
                      need(time.monotonic() < deadline, 'deadline')
                      if not os.path.lexists(path):
                          continue
                      info = path.lstat(); identity = (info.st_dev, info.st_ino, info.st_uid)
                      need(identity in self.admitted and stat.S_ISDIR(info.st_mode), 'cleanup')
                      if self.admitted[identity]:
                          # Only a previously admitted empty synthetic root-owned directory.
                          path.rmdir()
                      else:
                          remove_synthetic(path, identity, owner)
                  need(not any(os.path.lexists(path) for path in self.paths), 'cleanup')


          def run_cases(v, ci, root, copies, deadline, roots, clock=time.monotonic):
              global SYNTHETIC_PINS
              results = []
              def accepted(name, operation):
                  global LAST_CASE
                  LAST_CASE = name
                  phase('case_check')
                  need(clock() < deadline, 'deadline')
                  operation()
                  results.append(name)
                  CASE_PASSED[name] = True
              expected_failures = {
                  'runner_docker_rejected': ('code', 'supply_leaf_owner'),
                  'root_host_rejected': ('code', 'supply_leaf_owner'),
                  'root_retained_rejected': ('helper', 'installation_leaf_owner_bound'),
                  'outside_root_rejected': ('code', 'supply_name'),
                  'unsettled_rejected': ('code', 'supply_settlement'),
                  'symlink_rejected': ('errno', errno.ELOOP),
                  'hardlink_rejected': ('code', 'supply_leaf_links'),
                  'fifo_rejected': ('code', 'supply_leaf_type'),
                  'permissions_rejected': ('code', 'supply_leaf_permissions'),
                  'bound_rejected': ('code', 'supply_leaf_bound'),
                  'missing_rejected': ('errno', errno.ENOENT),
                  'unknown_rejected': ('code', 'supply_name'),
                  'copy_drift_rejected': ('code', 'supply_retention_custody'),
                  'duplicate_json_rejected': ('code', 'internal_verification_failure'),
                  'malformed_json_rejected': ('json', None),
                  'leaf_replacement_rejected': ('code', 'supply_leaf_identity'),
                  'original_byte_drift_rejected': ('code', 'supply_leaf_identity'),
                  'root_replacement_rejected': ('code', 'supply_root_identity'),
                  'root_owned_directory_rejected': ('code', 'supply_root_identity'),
                  'settlement_rejected': ('code', 'supply_settlement'),
                  'cleanup_receipt_replacement_rejected': ('code', 'supply_leaf_identity')}
              def rejected(name, operation):
                  global LAST_CASE
                  LAST_CASE = name
                  phase('case_check')
                  need(clock() < deadline, 'deadline')
                  kind, expected = expected_failures[name]
                  try:
                      operation()
                  except Exception as error:
                      valid = ((kind == 'code' and type(error) is v['VerificationFailure'] and error.code == expected)
                          or (kind == 'errno' and type(error) in (OSError, FileNotFoundError) and error.errno == expected)
                          or (kind == 'json' and type(error) is json.JSONDecodeError)
                          # Unchanged permanent reader exposes only this exact fixed error.
                          or (kind == 'helper' and type(error) is RuntimeError and error.args == (expected,)))
                      need(valid, 'case')
                      results.append(name)
                      CASE_PASSED[name] = True
                      return
                  raise PreflightFailure('case')
              def put(path, data=b'synthetic-owner\n', mode=0o600):
                  fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, mode)
                  try:
                      need(os.write(fd, data) == len(data), 'case')
                  finally:
                      os.close(fd)
              def read_once(path, settled=True, limit=65536):
                  with v['RuntimeSupply'](ci) as supply:
                      supply.settled = settled
                      return supply.read(path, limit)
              case_setup('settlement_admitted')
              registration = {'image_id': 'synthetic-preflight-image', 'containers': ['synthetic-owned']}
              ownership = {'schema': 'fixture046-supply-owner/1', 'preparation': 'ready', 'local': False,
                  'image_id': registration['image_id'], 'token': 'a' * 32,
                  'image_handle': 'desk-fixture046-runtime:owned-' + 'a' * 32,
                  'image_reserved': True, 'client_uncertain': False, 'command_pending': False,
                  'uncertain_command': None, 'containers': [{'name': 'synthetic-owned', 'removed': True}],
                  'image_removed': True, 'cleanup': 'complete'}
              cleanup = {'schema': 'fixture046-supply-cleanup/1', 'status': 'complete',
                  'preparation': 'ready', 'image_id': registration['image_id'],
                  'image_removed': True, 'client_uncertain': False}
              for name, record in [('ownership.json', ownership), ('cleanup.json', cleanup)]:
                  raw = (json.dumps(record, sort_keys=True) + '\n').encode()
                  put(root / name, raw); put(copies / name, raw)
              with v['RuntimeSupply'](ci) as supply:
                  actual_owner = v['supply_pair'](ci, supply, root / 'ownership.json',
                      copies / 'ownership.json', {}, copies.parent)
                  actual_cleanup = v['supply_pair'](ci, supply, root / 'cleanup.json',
                      copies / 'cleanup.json', {}, copies.parent)
                  accepted('settlement_admitted', lambda: v['settled_supply'](actual_owner, actual_cleanup, registration))
                  case_setup('cleanup_receipt_replacement_rejected')
                  original = root / 'cleanup.json'
                  raw = original.read_bytes(); original.rename(root / 'negative/old-cleanup'); put(original, raw)
                  rejected('cleanup_receipt_replacement_rejected', lambda: supply.read(original))
              case_setup('genuine_docker_ten')
              docker = sorted(v['DOCKER_ORIGINALS'])
              need(os.getuid() != 0 and all((root / name).lstat().st_uid == 0 for name in docker), 'mapping')
              need(all((copies / name).lstat().st_uid == os.getuid() for name in docker), 'mapping')
              accepted('genuine_docker_ten', lambda: [read_once(root / name) for name in docker])
              with v['RuntimeSupply'](ci) as supply:
                  supply.settled = True
                  custody = {}
                  accepted('genuine_runner_retained_ten', lambda: [v['supply_pair'](ci, supply,
                      root / name, copies / name, custody, copies.parent, json_record=False) for name in docker])
                  need(len(custody) == 10 and all(row['original'] == row['retained'] for row in custody.values()), 'case')
                  SYNTHETIC_PINS = {name: custody['copies/' + name] for name in docker}
                  accepted('terminal_identity', supply.terminal)
              rejected('unsettled_rejected', lambda: read_once(root / docker[0], False))
              outside = copies / docker[0]
              rejected('outside_root_rejected', lambda: read_once(outside))
              case_setup('runner_docker_rejected')
              name = docker[0]; target = root / name; saved = root / 'negative/docker-original'
              target.rename(saved); put(target)
              rejected('runner_docker_rejected', lambda: read_once(target))
              phase('case_restore')
              target.unlink(); saved.rename(target)
              case_setup('root_host_rejected')
              host = root / 'acquisition.json'; (root / 'negative/host').rename(host)
              rejected('root_host_rejected', lambda: read_once(host))
              phase('case_restore')
              host.unlink(); put(host, b'{}\n')
              case_setup('root_retained_rejected')
              kept = copies / name; kept.unlink(); (root / 'negative/retained').rename(kept)
              with v['RuntimeSupply'](ci) as supply:
                  supply.settled = True
                  rejected('root_retained_rejected', lambda: v['supply_pair'](ci, supply, target,
                      kept, {}, copies.parent, json_record=False))
              phase('case_restore')
              kept.unlink()
              case_setup('copy_drift_rejected')
              put(kept, b'altered\n')
              with v['RuntimeSupply'](ci) as supply:
                  supply.settled = True
                  rejected('copy_drift_rejected', lambda: v['supply_pair'](ci, supply, target,
                      kept, {}, copies.parent, json_record=False))
              phase('case_restore')
              kept.unlink(); put(kept)
              rejected('duplicate_json_rejected', lambda: v['strict_json'](b'{"x":1,"x":2}'))
              rejected('malformed_json_rejected', lambda: v['strict_json'](b'{'))
              rejected('unknown_rejected', lambda: read_once(root / 'unknown'))
              rejected('missing_rejected', lambda: read_once(root / 'install-identify.stderr'))
              rejected('bound_rejected', lambda: read_once(target, limit=1))
              # Mutations apply only to explicitly synthetic runner-owned host leaves.
              case_setup('symlink_rejected')
              host.unlink(); host.symlink_to(target)
              rejected('symlink_rejected', lambda: read_once(host))
              phase('case_restore')
              host.unlink(); put(host)
              case_setup('hardlink_rejected')
              os.link(host, root / 'negative/hardlink')
              rejected('hardlink_rejected', lambda: read_once(host))
              phase('case_restore')
              (root / 'negative/hardlink').unlink(); host.unlink()
              case_setup('fifo_rejected')
              os.mkfifo(host, 0o600)
              rejected('fifo_rejected', lambda: read_once(host))
              phase('case_restore')
              host.unlink()
              # Explicit mode only on this negative fixture; no admitted positives normalized.
              case_setup('permissions_rejected')
              put(host, mode=0o622)
              os.chmod(host, 0o622)
              rejected('permissions_rejected', lambda: read_once(host))
              phase('case_restore')
              host.unlink(); put(host)
              with v['RuntimeSupply'](ci) as supply:
                  case_setup('leaf_replacement_rejected')
                  supply.read(host)
                  host.rename(root / 'negative/old-host'); put(host)
                  rejected('leaf_replacement_rejected', lambda: supply.read(host))
              with v['RuntimeSupply'](ci) as supply:
                  case_setup('original_byte_drift_rejected')
                  supply.read(host)
                  host.write_bytes(b'changed-synthetic-bytes\n')
                  rejected('original_byte_drift_rejected', lambda: supply.read(host))
              case_setup('root_replacement_rejected')
              old = root.with_name('synthetic-root-old')
              with v['RuntimeSupply'](ci) as supply:
                  supply.read(host); roots.move(root, old); roots.create(root)
                  rejected('root_replacement_rejected', supply.terminal)
              phase('case_restore')
              root.rmdir(); roots.move(old, root)
              case_setup('root_owned_directory_rejected')
              replacement = root / 'negative/root-directory'; need(replacement.lstat().st_uid == 0
                  and stat.S_IMODE(replacement.lstat().st_mode) == 0o777, 'mapping')
              roots.admit(replacement, empty=True)
              roots.move(replacement, root.with_name('synthetic-root-replacement'))
              roots.move(root, old); roots.move(root.with_name('synthetic-root-replacement'), root)
              rejected('root_owned_directory_rejected', lambda: read_once(root / 'ownership.json'))
              phase('case_restore')
              root.rmdir(); roots.move(old, root)
              rejected('settlement_rejected', lambda: v['settled_supply'](
                  dict(ownership, command_pending=True), cleanup, registration))
              need(set(results) == set(CASES) and len(results) == len(CASES), 'case')
              return results


          def remove_synthetic(root, identity, owner):
              """Pinned no-follow cleanup of the exclusive, fixed-depth synthetic tree."""
              owned = owner.Owned(); primary = None
              try:
                  fd = owned.open(root, True)
                  info = os.fstat(fd)
                  need((info.st_dev, info.st_ino, info.st_uid) == identity
                       and info.st_uid == os.getuid() and stat.S_IMODE(info.st_mode) == 0o700, 'cleanup')
                  leaves = os.listdir(fd); need(len(leaves) <= 64, 'cleanup')
                  for name in leaves:
                      before = os.stat(name, dir_fd=fd, follow_symlinks=False)
                      if stat.S_ISDIR(before.st_mode):
                          need(name in ('negative', 'copies') and before.st_uid == os.getuid()
                               and stat.S_IMODE(before.st_mode) == 0o700, 'cleanup')
                          child_fd = owned.open(name, flags=os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, parent=fd)
                          need(owner.metadata(os.fstat(child_fd)) == owner.metadata(before), 'cleanup')
                          children = os.listdir(child_fd); need(len(children) <= 64, 'cleanup')
                          for child in children:
                              info = os.stat(child, dir_fd=child_fd, follow_symlinks=False)
                              if stat.S_ISDIR(info.st_mode):
                                  need(name == 'negative' and child == 'root-directory' and info.st_uid == 0, 'cleanup')
                                  os.rmdir(child, dir_fd=child_fd)
                              else:
                                  os.unlink(child, dir_fd=child_fd)
                          owned.close(child_fd)
                          info = os.stat(name, dir_fd=fd, follow_symlinks=False)
                          need((info.st_dev, info.st_ino, info.st_uid) ==
                               (before.st_dev, before.st_ino, before.st_uid), 'cleanup')
                          os.rmdir(name, dir_fd=fd)
                      else:
                          os.unlink(name, dir_fd=fd)
                  parent = owned.open(root.parent, True)
                  info = os.stat(root.name, dir_fd=parent, follow_symlinks=False)
                  need((info.st_dev, info.st_ino, info.st_uid) == identity, 'cleanup')
                  os.rmdir(root.name, dir_fd=parent)
                  need(not os.path.lexists(root), 'cleanup')
              except BaseException as error:
                  primary = error
              owned.finish(primary)


