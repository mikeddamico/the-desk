        run: |
          /usr/bin/python3 -I -B - <<'PY'
          """Temporary read-only native verifier; embed verbatim in the diagnostic workflow.

          This file is an offline review artifact, never an additional tracked source file.
          It grants no stage, partition or full-suite acceptance and performs no DB work.
          """
          import hashlib
          import importlib.util
          import json
          import os
          import re
          import sys
          import stat
          from pathlib import Path
          from urllib.parse import urlparse


          UPLOAD_OUTCOMES = (
              'BUILD_LAYOUT_UPLOAD_OUTCOME', 'EVAL_LAYOUT_UPLOAD_OUTCOME',
              'CONTROLS_UPLOAD_OUTCOME', 'NATIVE_UPLOAD_OUTCOME',
              'UPLOAD_OUTCOME', 'PRODUCER_UPLOAD_OUTCOME',
          )
          HELD_CASE = 'identifies a held client while preserving target isolation refusal'
          NATIVE_FILE = 'test/integration/connected-fixture105.test.ts'
          EXPECTED_SUMMARY = {'files': {'passed': 1, 'total': 1},
                              'tests': {'passed': 34, 'total': 34}}
          EXPECTED_FILES = {NATIVE_FILE: [{'tests': 34, 'failed': 0, 'skipped': 0, 'todo': 0}]}


          RUNTIME_ROOT = Path('/tmp/the-desk-fixture046-runtime')
          DOCKER_ORIGINALS = frozenset((
              'base-inventory.tsv', 'inventory.tsv', 'executables.txt', 'loader.txt',
              'libraries.txt', 'library-paths.txt', 'ldd.txt', 'version.txt', 'build.txt', 'audit.txt'))
          SUPPLY_NAMES = frozenset((
              'acquisition.json', 'base-inventory.tsv', 'inventory.tsv', 'executables.txt',
              'loader.txt', 'libraries.txt', 'library-paths.txt', 'ldd.txt', 'version.txt',
              'build.txt', 'audit.txt', 'install-identify.stdout', 'install-identify.stderr',
              'signature-0.stdout', 'signature-0.stderr', 'signature-1.stdout', 'signature-1.stderr',
              'base-inspect.stdout', 'base-inspect.stderr', 'prepare-state.stdout', 'prepare-state.stderr',
              'prepare-final.stdout', 'prepare-final.stderr', 'prepare-remove.stdout', 'prepare-remove.stderr',
              'commit.stdout', 'commit.stderr', 'commit-inspect.stdout', 'commit-inspect.stderr',
              'ownership.json', 'cleanup.json'))
          PHASES = frozenset(('startup', 'binding_before', 'controls', 'native_settlement',
              'source_journal', 'producer_inventory', 'retention_inventory',
              'fixture046_registration', 'fixture046_settlement', 'fixture046_original',
              'fixture046_retained', 'fixture046_custody', 'binding_after', 'unknown'))
          FAILURE_CODES = frozenset(('supply_name', 'supply_root_identity', 'supply_leaf_type',
              'supply_leaf_owner', 'supply_leaf_links', 'supply_leaf_permissions',
              'supply_leaf_bound', 'supply_leaf_stability', 'supply_leaf_identity',
              'supply_leaf_path_identity', 'supply_original_changed', 'supply_retention_custody',
              'supply_registration', 'supply_settlement', 'supply_helper_failure',
              'internal_verification_failure'))
          SOURCE_CLASSES = frozenset(('runner_original', 'docker_original', 'runner_retained', 'none'))
          PHASE = 'startup'
          FILE_ID = None
          SOURCE_CLASS = 'none'


          class VerificationFailure(RuntimeError):
              def __init__(self, code):
                  self.code = code if type(code) is str and code in FAILURE_CODES else 'internal_verification_failure'
                  super().__init__(self.code)


          def phase(value, file_id=None, source_class='none'):
              global PHASE, FILE_ID, SOURCE_CLASS
              require(type(value) is str and value in PHASES
                      and (file_id is None or (type(file_id) is str and file_id in SUPPLY_NAMES | {'registration'}))
                      and type(source_class) is str and source_class in SOURCE_CLASSES, 'internal_verification_failure')
              PHASE, FILE_ID, SOURCE_CLASS = value, file_id, source_class


          def require(condition, reason):
              if not condition:
                  raise VerificationFailure(reason)


          def failure_record(error):
              # Never inspect exception text, class names, paths or arbitrary payloads.
              code = error.code if type(error) is VerificationFailure else 'supply_helper_failure'
              valid = (type(code) is str and code in FAILURE_CODES and type(PHASE) is str and PHASE in PHASES
                       and (FILE_ID is None or (type(FILE_ID) is str and FILE_ID in SUPPLY_NAMES | {'registration'}))
                       and type(SOURCE_CLASS) is str and SOURCE_CLASS in SOURCE_CLASSES)
              return {'schema': 'ci-maintenance-native-diagnostic/1', 'diagnostic_only': True,
                      'native_passed': False, 'full_acceptance': False,
                      'failure_phase': PHASE if valid else 'unknown',
                      'failure_code': code if valid else 'internal_verification_failure',
                      'file_id': FILE_ID if valid else None,
                      'source_class': SOURCE_CLASS if valid else 'none',
                      'verdict_upload_requires_separate_gate': True}


          def emit_failure(error):
              # The fallback sink is untrusted too: no serialization/output traceback.
              try:
                  print(json.dumps(failure_record(error), sort_keys=True))
              except BaseException:
                  pass


          class RuntimeSupply:
              """Pinned private root and exact producer roles, only for this diagnostic."""
              def __init__(self, ci):
                  require(os.getuid() != 0, 'supply_leaf_owner')
                  require(ci.FIXTURE046_RUNTIME == RUNTIME_ROOT and
                          set(ci.FIXTURE046_SUPPLY_FILES) | {'cleanup.json'} == SUPPLY_NAMES and
                          len(ci.FIXTURE046_SUPPLY_FILES) == len(SUPPLY_NAMES) - 1 and
                          DOCKER_ORIGINALS < SUPPLY_NAMES, 'supply_name')
                  self.owner = ci.installation_owner()
                  self.owned = self.owner.Owned()
                  self.admitted = {}
                  self.settled = False
                  try:
                      self.root_fd = self.owned.open(RUNTIME_ROOT, True)
                      self.root_identity = self.root_info(self.root_fd)
                  except BaseException as error:
                      self.owned.finish(error)

              def root_info(self, fd):
                  info = os.fstat(fd)
                  require(stat.S_ISDIR(info.st_mode) and info.st_uid == os.getuid()
                          and stat.S_IMODE(info.st_mode) == 0o700, 'supply_root_identity')
                  return (info.st_dev, info.st_ino, info.st_uid, info.st_gid, info.st_mode)

              def check_root(self):
                  self.owner.entry()
                  fd = self.owned.open(RUNTIME_ROOT, True)
                  require(self.root_info(fd) == self.root_identity == self.root_info(self.root_fd),
                          'supply_root_identity')
                  self.owned.close(fd)

              def __enter__(self):
                  return self

              def __exit__(self, kind, value, traceback):
                  self.owned.finish(value)

              def read(self, path, limit=65536):
                  require(type(path) is type(RUNTIME_ROOT) and path.parent == RUNTIME_ROOT
                          and path.name in SUPPLY_NAMES, 'supply_name')
                  name = path.name
                  docker = name in DOCKER_ORIGINALS
                  phase('fixture046_original', name, 'docker_original' if docker else 'runner_original')
                  require(not docker or self.settled, 'supply_settlement')
                  require(type(limit) is int and 0 < limit <= 16 * 1024 * 1024, 'supply_leaf_bound')
                  self.check_root()
                  fd = self.owned.open(name, flags=os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK,
                                       parent=self.root_fd)
                  before = os.fstat(fd)
                  identity = self.owner.metadata(before)
                  require(stat.S_ISREG(before.st_mode), 'supply_leaf_type')
                  require(before.st_uid == (0 if docker else os.getuid()), 'supply_leaf_owner')
                  require(before.st_nlink == 1, 'supply_leaf_links')
                  require(before.st_mode & 0o022 == 0, 'supply_leaf_permissions')
                  require(0 <= before.st_size <= limit, 'supply_leaf_bound')
                  prior = self.admitted.get(name)
                  require(prior is None or identity == prior[0], 'supply_leaf_identity')
                  blocks = []; count = 0
                  while count <= limit:
                      block = os.read(fd, min(65536, limit + 1 - count))
                      if not block:
                          break
                      blocks.append(block); count += len(block)
                  data = b''.join(blocks)
                  require(count == before.st_size and identity == self.owner.metadata(os.fstat(fd)),
                          'supply_leaf_stability')
                  require(prior is None or data == prior[1], 'supply_original_changed')
                  require(identity == self.owner.metadata(os.stat(name, dir_fd=self.root_fd,
                                                                 follow_symlinks=False)),
                          'supply_leaf_path_identity')
                  self.owned.close(fd)
                  self.check_root()
                  if prior is None:
                      self.admitted[name] = (identity, data, limit)
                  return data

              def terminal(self):
                  for name, (_, _, limit) in list(self.admitted.items()):
                      self.read(RUNTIME_ROOT / name, limit)
                  phase('fixture046_custody')
                  self.check_root()


          def equal(left, right):
              # JSON equality must not treat True as integer 1.
              return json.dumps(left, sort_keys=True, allow_nan=False) == json.dumps(
                  right, sort_keys=True, allow_nan=False)


          def digest(data):
              return hashlib.sha256(data).hexdigest()


          def pin(data):
              return {'bytes': len(data), 'sha256': digest(data)}


          def strict_json(data):
              def object_pairs(pairs):
                  value = {}
                  for key, item in pairs:
                      require(key not in value, 'duplicate_json_key')
                      value[key] = item
                  return value

              def invalid_constant(value):
                  raise RuntimeError('nonfinite_json')

              return json.loads(data.decode('utf8', errors='strict'),
                                object_pairs_hook=object_pairs,
                                parse_constant=invalid_constant)


          def fixed_records(text, prefix, limit):
              results = []
              for line in text.splitlines():
                  # Vitest may prepend an stderr test heading, but witness lines themselves
                  # are emitted with a fixed prefix, never recovered from arbitrary substrings.
                  if line.startswith(prefix + ' '):
                      require(len(line.encode('utf8')) + 1 <= limit, 'witness_bound')
                      results.append(strict_json(line[len(prefix) + 1:].encode('utf8')))
              return results


          def held_witness(text):
              witness = fixed_records(text, 'FIXTURE_HELD_CLIENT_CONTROL', 1024)
              expected = {'schema': 'fixture-held-client-control/1', 'case': HELD_CASE,
                          'rejectionIdentity': True, 'wrapperRestored': True,
                          'heldPidContinuity': True, 'hiddenOriginProvisional': True,
                          'cleanupComplete': True}
              require(equal(witness, [expected]), 'held_client_witness')
              rows = [row for row in fixed_records(text, 'FIXTURE_TARGET_DIAGNOSTIC', 1024)
                      if row.get('scope') == 'held_client_control']
              require(len(rows) == 1, 'held_client_target_population')
              row = rows[0]
              require(set(row) == {'schema', 'scope', 'vector', 'supplement'}
                      and row['schema'] == 'fixture-target-diagnostic/2', 'held_target_shape')
              vector = row['vector']
              expected_vector = {'ordinal': 1, 'outcome': 'rows', 'oneRow': True,
                                 'databaseMatches': True, 'runtimeRole': True,
                                 'notElevated': True, 'noOtherSessions': False,
                                 'oidString': True, 'loginString': True, 'databaseString': True,
                                 'addressValid': True, 'portValid': True}
              require(type(vector) is dict and set(vector) == set(expected_vector) | {'otherSessions'},
                      'held_target_vector_shape')
              require(equal({key: vector[key] for key in expected_vector}, expected_vector)
                      and type(vector['otherSessions']) is int and vector['otherSessions'] >= 1,
                      'held_target_assertions')
              supplement = row['supplement']
              require(supplement.get('status') == 'inconclusive'
                      and supplement.get('reason') == 'unknown_type'
                      and supplement.get('truncated') is False, 'held_target_supplement')
              sample = supplement.get('sample')
              require(type(sample) is list and 1 <= len(sample) <= 8, 'held_target_sample')
              unknown = [item['pid'] for item in sample
                         if type(item) is dict and set(item) == {'pid', 'category'}
                         and item['category'] == 'unknown' and type(item['pid']) is int
                         and item['pid'] > 0]
              maintenance = [item for item in fixed_records(text, 'FIXTURE_TARGET_MAINTENANCE', 2048)
                             if item.get('scope') == 'held_client_control']
              require(len(maintenance) == 1, 'held_maintenance_population')
              record = maintenance[0]
              require(set(record) == {'schema', 'scope', 'ordinal', 'status', 'reason', 'cleanup', 'entries'}
                      and record['schema'] == 'fixture-target-maintenance/1'
                      and type(record['ordinal']) is int and record['ordinal'] == 1
                      and record['status'] == 'observed' and record['reason'] == 'none'
                      and record['cleanup'] == 'driver_handoff', 'held_maintenance_shape')
              require(type(record['entries']) is list and 1 <= len(record['entries']) <= 8,
                      'held_maintenance_entries')
              held_pids = [pid for pid in unknown if
                          {'pid': pid, 'category': 'client', 'binding': 'provisional',
                           'reason': 'hidden_origin'} in record['entries']]
              require(len(set(held_pids)) >= 1, 'held_pid_category_correspondence')
              summary = [item for item in fixed_records(text, 'FIXTURE_TARGET_DIAGNOSTIC_SUMMARY', 1024)
                         if item.get('scope') == 'held_client_control']
              require(len(summary) == 1, 'held_summary_population')
              require(equal(summary[0], {'schema': 'fixture-target-diagnostic-summary/2',
                                        'scope': 'held_client_control', 'observed': 1, 'cap': 64,
                                        'capReached': False, 'failureVectors': 1,
                                        'observationFailed': False, 'inconclusive': True}),
                      'held_summary')
              return {'witness': expected, 'target': row, 'maintenance': record,
                      'summary': summary[0], 'corroborated_pids': sorted(set(held_pids)),
                      'raw_database_identifiers_reconstructed': False}


          def stable_read(ci, path, limit=65536, private=False):
              """Read either a private original or an honest legacy 0644 retention copy."""
              require(path.lstat().st_mode & 0o022 == 0, 'evidence_write_permissions')
              return ci.fixture_read(path, limit, private)


          def load_ci():
              require(Path.cwd() == Path('/tmp/e') and Path.cwd().resolve() == Path('/tmp/e'),
                      'genuine_evaluation_checkout_required')
              require(os.environ.get('DESK_CI_ROLE_TEMP') ==
                      str(Path(os.environ['RUNNER_TEMP']) / 'evaluation'), 'evaluation_role_required')
              spec = importlib.util.spec_from_file_location(
                  'maintenance_native_ci', '/tmp/e/tools/ci-validation/ci.py')
              module = importlib.util.module_from_spec(spec)
              sys.modules[spec.name] = module
              spec.loader.exec_module(module)
              require(module.ROOT == Path('/tmp/e'), 'ci_module_root')
              return module


          def verify(ci):
              require(os.environ.get('GITHUB_JOB') == 'verify-maintenance-fixture105', 'actual_job')
              require(os.environ.get('GITHUB_EVENT_NAME') == 'pull_request', 'actual_pr_event')
              require(os.environ.get('GITHUB_REPOSITORY') == 'mikeddamico/the-desk', 'repository')
              require(os.environ.get('GITHUB_ACTIONS') == 'true'
                      and os.environ.get('ImageOS') == 'ubuntu24'
                      and os.environ.get('DESK_CI_PARTITION') == 'rest', 'hosted_rest')
              for key in UPLOAD_OUTCOMES + ('FIXTURE046_CLEANUP_OUTCOME', 'NATIVE_OUTCOME'):
                  require(os.environ.get(key) == 'success', 'platform_' + key)
              owner = ci.installation_owner()
              phase('binding_before')
              before = owner.outer(ci, 'EF')
              require(equal(before, ci.check_partition_binding()), 'before_complete_binding')
              identity, members = ci.proof_identity_now(True)
              require(os.environ.get('GITHUB_REF') == 'refs/pull/%s/merge' % identity['pr_number'],
                      'actual_pr_merge_ref')
              require(os.environ.get('GITHUB_WORKFLOW_REF') ==
                      'mikeddamico/the-desk/.github/workflows/ci.yml@' + os.environ['GITHUB_REF'],
                      'actual_workflow_ref')
              require(equal(ci.partition_identity(identity, members), before['identity']),
                      'current_partition_identity')
              require(len(members) == 520, 'source_population')
              event = ci.load_event()
              head_ref = event['pull_request']['head']['ref']
              require(type(head_ref) is str and 0 < len(head_ref) <= 1024, 'pr_head_ref')
              require(re.fullmatch(r'[0-9a-f]{40}', os.environ.get('GITHUB_WORKFLOW_SHA', '')),
                      'workflow_commit_identity')
              base = ci.ci_dir()
              evidence = base / 'evidence'
              native = evidence / 'fixture105-native'
              retained = native / 'retained'
              fixture = base / 'tmp' / ci.FIXTURE_NAME
              controls = base / 'upload-controls'
              full = base / 'upload-full'
              secret = urlparse(os.environ['TEST_DATABASE_URL']).password or ''
              custody = {}

              def raw(path, limit=65536, private=False):
                  # Legacy collect files inherit 0644 while producer/native files are 0600.
                  # Both require stable no-follow reads, current UID, one link and no write
                  # permission for another user; requiring 0600 here would reject honest copies.
                  return stable_read(ci, path, limit, private)

              def read(path, limit=65536):
                  return strict_json(raw(path, limit))

              def pair(path, copy, limit=65536, redaction=False, whole_url=False, json_record=True):
                  original = raw(path, limit)
                  kept = raw(copy, limit)
                  extra = (os.environ['TEST_DATABASE_URL'],) if whole_url else (secret,)
                  require(kept == (ci.redact(original, extra) if redaction else original),
                          'retention_custody_' + copy.name)
                  require(raw(path, limit) == original, 'original_changed_' + path.name)
                  custody[str(copy.relative_to(base))] = {'original': pin(original), 'retained': pin(kept)}
                  return strict_json(original) if json_record else original

              phase('controls')
              require(not ci.controls_problems(controls), 'controls_validation')
              # API is supplied by the permanent maintenance patch, not a second parser.
              receipt_bytes = ci.read_db_probe(evidence / 'db-probe.json', before)
              for bundle in (controls, full):
                  ci.verify_db_probe_custody(evidence / 'db-probe.json', bundle / 'db-probe.json',
                                             before, expected_bytes=receipt_bytes)
              collection = read(full / 'final.json', ci.JSON_LIMIT * 4)
              require(ci.collection_identity_ok(collection), 'full_collection_identity')
              require(collection['scope'] == 'full'
                      and equal(collection['verdicts'], {'prerequisite': True, 'focused': True, 'all': None})
                      and collection['not_attempted'] == ['all']
                      and collection['all_stages_ok'] is False
                      and collection['evidence_status'] == 'partial/censored'
                      and collection['collection_problems'] == {'missing': [], 'censored': [], 'errors': []}
                      and equal(collection['execution'], before['execution']), 'intentional_full_absence')
              for relative in ('all', 'verdict-all.json', 'stage-owner/all', 'stage-check/all',
                               'bind-post-all.json', 'partition-proof.json'):
                  require(not os.path.lexists(evidence / relative), 'unexpected_aggregate_' + relative)
              for stage in ('prerequisite', 'focused'):
                  require(ci.stage_verdict_ok(evidence / ('verdict-' + stage + '.json'), stage),
                          'control_stage_' + stage)
              semantic = pair(evidence / 'identity-witness/result.json',
                              full / 'identity-witness/result.json', 262144, redaction=True, whole_url=True)
              require(semantic.get('schema') == 'ci-semantic-identity-comparison/1'
                      and semantic.get('all_six_equal') is True
                      and equal(semantic['build'], semantic['evaluation']), 'semantic_identity')
              require(equal(owner.identity_witness(read(evidence / 'identity-witness/stdout', 16384), 'evaluation'),
                            semantic['evaluation']), 'semantic_live_witness')
              phase('native_settlement')
              invocation = pair(native / 'invocation.json', retained / 'invocation.json')
              require(invocation['argv'] == ['/usr/bin/timeout', '--signal=TERM', '--kill-after=20s',
                                           '1800s', '/usr/bin/python3', '-I', '-B',
                                           'test/support/p33-parity-supervisor.py', 'guard', 'fixture105-native']
                      and invocation['cwd'] == '/tmp/e'
                      and invocation['profile'] == 'fixture105-native'
                      and type(invocation['guard_invocations']) is int and invocation['guard_invocations'] == 1
                      and invocation['native_case_timeout_ms'] is None
                      and equal(invocation['identity'], before['identity']), 'native_invocation')
              result = pair(native / 'result.json', retained / 'result.json')
              for key in ('ok', 'direct_reaped', 'maintenance_ended', 'population_equal'):
                  require(result.get(key) is True, 'native_' + key)
              require(type(result['guard_exit']) is int and result['guard_exit'] == 0
                      and result['guard_signal'] is None and result['primary'] is None
                      and result['residual_group_members'] == [] and result['errors'] == [], 'native_settlement')
              guard = pair(native / 'guard-result.json', retained / 'guard-result.json')
              errors = []
              ci.check_ledger(guard, 'native', errors, guard=True)
              require(not errors, 'native_guard_ledger')
              known_attempts = set()
              for stage in ('prerequisite', 'focused'):
                  verdict = read(evidence / ('verdict-' + stage + '.json'), ci.JSON_LIMIT * 4)
                  known_attempts.add(verdict['facts']['attempt'])
              runtime = ci.find_runtime_dir(base / 'tmp')
              attempts = bounded_entries(runtime, 16)
              actual_attempts = {name for name in attempts if re.fullmatch(r'attempt-[a-z0-9_]{8}', name)}
              require(known_attempts <= actual_attempts and len(actual_attempts - known_attempts) == 1,
                      'exactly_one_new_guard_attempt')
              native_attempt = (actual_attempts - known_attempts).pop()
              require(raw(runtime / native_attempt / 'guard-result.json') == raw(native / 'guard-result.json'),
                      'original_guard_custody')
              process = pair(native / 'process.json', retained / 'process.json')
              require(set(process) == {'pid', 'pgid'} and type(process['pid']) is int
                      and process['pid'] > 0 and process['pid'] == process['pgid'], 'native_process')
              for name in os.listdir('/proc'):
                  if not name.isdecimal():
                      continue
                  try:
                      data = Path('/proc', name, 'stat').read_bytes()
                  except (FileNotFoundError, ProcessLookupError):
                      continue
                  require(len(data) <= 4096, 'process_stat_bound')
                  require(int(data[data.rfind(b')') + 2:].split()[2]) != process['pgid'],
                          'native_residual_process_group')
              population_before = pair(native / 'population-before.json', retained / 'population-before.json')
              population_after = pair(native / 'population-after.json', retained / 'population-after.json')
              require(equal(population_before, population_after)
                      and set(population_before) == {'status', 'databases', 'roles', 'pid'}
                      and population_before['status'] == 'observed'
                      and type(population_before['pid']) is int and population_before['pid'] > 0,
                      'independent_population_observations')
              for key in ('databases', 'roles'):
                  values = population_before[key]
                  require(type(values) is list and len(values) <= 256
                          and all(type(value) is str and value.startswith('fl_') for value in values)
                          and values == sorted(set(values)), 'population_shape')
              streams = {}
              require(set(result['captured_streams']) == {'stdout', 'stderr'}
                      and set(result['stream_bytes']) == {'stdout', 'stderr'}, 'capture_population')
              for name in ('stdout', 'stderr'):
                  data = raw(native / name, 8 * 1024 * 1024)
                  capture = result['captured_streams'][name]
                  require(equal(capture, dict(pin(data), complete=True))
                          and type(result['stream_bytes'][name]) is int
                          and result['stream_bytes'][name] == len(data), 'raw_capture_' + name)
                  copy = raw(retained / name, 8 * 1024 * 1024)
                  require(copy == ci.redact(data, (secret,)), 'redacted_capture_' + name)
                  require(raw(native / name, 8 * 1024 * 1024) == data, 'raw_capture_changed')
                  custody[str((retained / name).relative_to(base))] = {
                      'original': pin(data), 'retained': pin(copy)}
                  streams[name] = data.decode('utf8', errors='strict')
              summary, problems = ci.parse_summary(streams['stdout'])
              require(equal(summary, EXPECTED_SUMMARY) and problems == []
                      and equal(ci.parse_file_lines(streams['stdout']), EXPECTED_FILES), 'native_complete_counts')
              clean = ci.ANSI.sub('', streams['stdout'] + '\n' + streams['stderr'])
              require(ci.FAILURE_LINE.search(clean) is None
                      and not any(needle in clean for needle in ci.FATAL_TEXT), 'native_failure_output')
              held = held_witness(streams['stderr'])
              require(equal(held_witness(raw(retained / 'stderr', 8 * 1024 * 1024).decode('utf8')), held),
                      'retained_held_witness')
              source_before = pair(native / 'source-before.json', retained / 'source-before.json')
              source_after = pair(native / 'source-after.json', retained / 'source-after.json')
              binding, loader = ci.fixture_validate(base, ci.ROOT, True)
              current_source = {'identity': before['identity'], 'binding': binding, 'loader': loader,
                                'source_inventory_sha256': ci.fixture_hash(ci.fixture_bytes(ci.fixture_graph(ci.ROOT, 'source'))),
                                'tools_inventory_sha256': ci.fixture_hash(ci.fixture_bytes(ci.fixture_graph(ci.ROOT / 'node_modules', 'tools')))}
              require(set(source_before) == set(current_source) and equal(source_before, current_source),
                      'source_before_current')
              require(equal({key: source_after[key] for key in current_source}, current_source)
                      and equal(source_after['summary'], EXPECTED_SUMMARY)
                      and source_after['summary_errors'] == []
                      and equal(source_after['file_results'], EXPECTED_FILES)
                      and source_after['native_suite_complete'] is True, 'source_after_current')
              phase('source_journal')
              journal = pair(evidence / 'fixture105-suite.json', retained / 'fixture105-suite.json',
                             ci.SNAPSHOT_LIMIT, redaction=True)
              ci.fixture_journal(fixture, journal)
              # Validate both retained trees with the same full journal and retain every
              # original/reference pair, including inventories, intentions and failure receipts.
              compare_fixture(ci, fixture, retained / 'fixture105', pair, False)
              compare_fixture(ci, fixture, full / 'fixture105', pair, True)
              pair(evidence / 'fixture105-suite.json', full / 'fixture105/suite.json',
                   ci.SNAPSHOT_LIMIT, redaction=True, whole_url=True)
              ci.fixture_journal(retained / 'fixture105', strict_json(raw(retained / 'fixture105-suite.json', ci.SNAPSHOT_LIMIT)))
              # Full collect uses legacy 0644 copies; fixture_journal's private reader is
              # intentionally not patched. Its original validation plus exact authorized
              # byte custody above proves the corresponding full-bundle content.
              phase('producer_inventory')
              for bundle in (controls, full):
                  verify_producer_inventory(ci, raw, read, fixture, bundle)
              phase('retention_inventory')
              verify_retention_inventory(ci, raw, read, fixture, evidence, full)
              supply_sources = verify_cleanup(ci, pair, read, evidence, full, custody)
              # Reviewed fixed native sources contain the real holder, original exception,
              # descriptor restoration, durable-row/receipt checks and post-cleanup PID query.
              for name, expected in SOURCE_PINS.items():
                  require(digest(raw(ci.ROOT / name, 2 * 1024 * 1024, False)) == expected,
                          'held_client_source_assertions_' + name)
              phase('binding_after')
              after = owner.outer(ci, 'EF')
              require(equal(after, ci.check_partition_binding()) and equal(before, after), 'after_complete_binding')
              identity_after, members_after = ci.proof_identity_now(True)
              require(equal(identity_after, identity) and equal(members_after, members)
                      and equal(ci.load_event(), event), 'source_identity_drift')
              for bundle in (controls, full):
                  ci.verify_db_probe_custody(evidence / 'db-probe.json', bundle / 'db-probe.json',
                                             after, expected_bytes=receipt_bytes)
              return {'schema': 'ci-maintenance-native-diagnostic/1', 'diagnostic_only': True,
                      'native_passed': True, 'native_tests': 34, 'full_acceptance': False,
                      'identity': identity, 'binding': before, 'actual_job': os.environ['GITHUB_JOB'],
                      'pr_head_ref': head_ref,
                      'uploads': {name: os.environ[name] for name in UPLOAD_OUTCOMES},
                      'held_client': held, 'source_assertion_sha256': SOURCE_PINS,
                      'native_attempt': native_attempt, 'custody': custody,
                      'fixture046_source_classes': supply_sources,
                      'collection_status': 'partial/censored', 'not_attempted': ['all'],
                      'verdict_upload_requires_separate_gate': True}


          def bounded_entries(path, cap):
              result = []
              with os.scandir(path) as iterator:
                  for entry in iterator:
                      require(len(result) < cap, 'directory_population_bound')
                      result.append(entry.name)
              return sorted(result)


          def compare_fixture(ci, original, retained, pair, whole_url):
              pair(original / 'ROOT.json', retained / 'ROOT.json', 262144,
                   redaction=True, whole_url=whole_url)
              require(set(bounded_entries(original / 'bindings', 32)) == set(ci.FIXTURE_BINDINGS)
                      and set(bounded_entries(retained / 'bindings', 32)) == set(ci.FIXTURE_BINDINGS),
                      'fixture_binding_population')
              for name in ci.FIXTURE_BINDINGS:
                  pair(original / 'bindings' / name, retained / 'bindings' / name,
                       ci.SNAPSHOT_LIMIT if 'INVENTORY' in name else 262144,
                       redaction=True, whole_url=whole_url)
              for directory, cap in (('expectations', 384), ('receipts', 128)):
                  entries = bounded_entries(original / directory, cap)
                  require(entries == bounded_entries(retained / directory, cap), 'fixture_retained_population')
                  for name in entries:
                      if directory == 'expectations':
                          require(re.fullmatch(r'[0-9a-f]{64}\.(intent|terminal|claims-failure)\.json', name),
                                  'expectation_name')
                          pair(original / directory / name, retained / directory / name, 16384,
                               redaction=True, whole_url=whole_url)
                      else:
                          require(re.fullmatch(r'[0-9a-f]{64}', name), 'receipt_target')
                          leaves = bounded_entries(original / directory / name, 2)
                          require(leaves == bounded_entries(retained / directory / name, 2), 'receipt_leaf_population')
                          for leaf in leaves:
                              require(leaf in ('CONSTRUCTION.json', 'CLAIMS-FAILURE.json'), 'receipt_leaf')
                              pair(original / directory / name / leaf, retained / directory / name / leaf,
                                   16384 if leaf == 'CONSTRUCTION.json' else 262144,
                                   redaction=True, whole_url=whole_url)


          def verify_producer_inventory(ci, raw, read, fixture, bundle):
              owner = ci.installation_owner()
              expected = {}
              for name in owner.BINDINGS:
                  expected['metadata/' + name] = fixture / 'bindings' / name
              for role in ('build', 'evaluation'):
                  producer = owner.role_base(ci, role) / 'evidence/producer'
                  for name in ('stdout', 'stderr', 'owner.json'):
                      expected[role + '/install/' + name] = producer / 'install' / name
              build = owner.role_base(ci, 'build') / 'evidence/producer'
              for gate in owner.GATES:
                  for name in ('stdout', 'stderr', 'result.json', 'owner.json'):
                      expected['build/quality/' + gate + '/' + name] = build / 'quality' / gate / name
              expected['build/quality/owner.json'] = build / 'quality/owner.json'
              evaluation = owner.role_base(ci, 'evaluation') / 'evidence'
              for name in ('stdout', 'stderr', 'copy-owner.json', 'owner.json'):
                  expected['evaluation/transfer/' + name] = evaluation / 'producer/transfer' / name
              for name in (owner.POLICY_PATH, owner.QUALITY_PATH):
                  expected['policies/' + Path(name).name] = ci.ROOT / name
              for name in ('partition-init.json', 'partition.json', 'fixture105-binding.json'):
                  expected[name] = evaluation / name
              manifest = read(bundle / 'producer/MANIFEST.json', 262144)
              require(set(manifest) == {'schema', 'role', 'members', 'bytes'}
                      and manifest['schema'] == 'ci-producer-bundle/1' and manifest['role'] == 'evaluation'
                      and type(manifest['members']) is list
                      and len(manifest['members']) == len(expected) <= 95, 'producer_manifest')
              seen = set()
              total = 0
              for row in manifest['members']:
                  require(type(row) is dict and set(row) == {'path', 'bytes', 'sha256'}
                          and row['path'] in expected and row['path'] not in seen, 'producer_reference')
                  name = row['path']
                  seen.add(name)
                  source = raw(expected[name], 8 * 1024 * 1024)
                  copy = raw(bundle / 'producer' / name, 8 * 1024 * 1024)
                  require(equal({'bytes': row['bytes'], 'sha256': row['sha256']}, pin(source))
                          and copy == ci.redact(source, (os.environ['TEST_DATABASE_URL'],)),
                          'producer_reference_custody')
                  total += len(source)
                  require(total <= 160 * 1024 * 1024, 'producer_bundle_bound')
              require(seen == set(expected) and type(manifest['bytes']) is int
                      and manifest['bytes'] == total, 'producer_bundle_population')


          def verify_retention_inventory(ci, raw, read, fixture, evidence, full):
              manifest = read(full / 'fixture105-retention.json', ci.SNAPSHOT_LIMIT)
              require(raw(fixture / 'RETENTION.json', ci.SNAPSHOT_LIMIT) ==
                      raw(full / 'fixture105-retention.json', ci.SNAPSHOT_LIMIT), 'terminal_retention_identity')
              require(set(manifest) == {'schema', 'scope', 'files', 'total_bytes', 'problems'}
                      and manifest['schema'] == 'fixture105-retention/1' and manifest['scope'] == 'full'
                      and manifest['problems'] == {'missing': [], 'censored': [], 'errors': []}
                      and type(manifest['files']) is list and len(manifest['files']) <= 1024,
                      'retention_manifest_shape')
              seen = set()
              total = 0
              for row in manifest['files']:
                  require(type(row) is dict and set(row) == {'path', 'original', 'retained', 'redacted'},
                          'retention_reference_shape')
                  name = row['path']
                  require(type(name) is str and name not in seen and not name.startswith('/')
                          and '..' not in Path(name).parts, 'retention_reference_path')
                  seen.add(name)
                  if name == 'fixture105/suite.json':
                      source = evidence / 'fixture105-suite.json'
                  elif name == 'fixture105/runner-binding.json':
                      source = evidence / 'fixture105-binding.json'
                  elif name.startswith('fixture105/'):
                      source = fixture / name.removeprefix('fixture105/')
                  elif name.startswith('tooling-fixture105/'):
                      suffix = name.removeprefix('tooling-fixture105/')
                      if '/' in suffix:
                          stage, leaf = suffix.split('/', 1)
                          require(stage in ('prerequisite', 'focused'), 'retention_snapshot_stage')
                          source = evidence / ('fixture105-cache-' + stage) / leaf
                      else:
                          require(re.fullmatch(r'(before|after)-(prerequisite|focused)\.json', suffix),
                                  'retention_stage_record')
                          source = evidence / ('fixture105-' + suffix)
                  else:
                      raise RuntimeError('retention_unknown_reference')
                  original = raw(source, ci.SNAPSHOT_LIMIT)
                  retained = raw(full / name, ci.SNAPSHOT_LIMIT)
                  require(equal(row['original'], pin(original)) and equal(row['retained'], pin(retained))
                          and row['redacted'] is (original != retained)
                          and retained == ci.redact(original, (os.environ['TEST_DATABASE_URL'],)),
                          'retention_inventory_custody')
                  total += len(original)
                  require(total <= 64 * 1024 * 1024, 'retention_total_bound')
              require(type(manifest['total_bytes']) is int and manifest['total_bytes'] == total,
                      'retention_total_identity')
              required = {'fixture105/ROOT.json', 'fixture105/runner-binding.json', 'fixture105/suite.json'}
              required.update('fixture105/bindings/' + name for name in ci.FIXTURE_BINDINGS)
              require(required <= seen, 'retention_required_references')


          def supply_pair(ci, supply, path, copy, custody, base, limit=65536, json_record=True):
              original = supply.read(path, limit)
              phase('fixture046_retained', path.name, 'runner_retained')
              kept = stable_read(ci, copy, limit)
              require(kept == ci.redact(original, (os.environ['TEST_DATABASE_URL'],)),
                      'supply_retention_custody')
              require(supply.read(path, limit) == original, 'supply_original_changed')
              custody[str(copy.relative_to(base))] = {'original': pin(original), 'retained': pin(kept)}
              return strict_json(original) if json_record else original


          def settled_supply(ownership, cleanup, registration):
              require(ownership['schema'] == 'fixture046-supply-owner/1'
                      and ownership['preparation'] == 'ready' and ownership['local'] is False
                      and ownership['image_id'] == registration['image_id']
                      and re.fullmatch(r'[0-9a-f]{32}', ownership['token'])
                      and ownership['image_handle'] == 'desk-fixture046-runtime:owned-' + ownership['token']
                      and ownership['image_reserved'] is True and ownership['client_uncertain'] is False
                      and ownership['command_pending'] is False and ownership['uncertain_command'] is None
                      and [row['name'] for row in ownership['containers']] == registration['containers']
                      and all(row['removed'] is True for row in ownership['containers'])
                      and ownership['image_removed'] is True and ownership['cleanup'] == 'complete',
                      'supply_settlement')
              require(cleanup['schema'] == 'fixture046-supply-cleanup/1'
                      and cleanup['status'] == 'complete' and cleanup['preparation'] == 'ready'
                      and cleanup['image_id'] == registration['image_id']
                      and cleanup['image_removed'] is True and cleanup['client_uncertain'] is False,
                      'supply_settlement')


          def verify_cleanup(ci, pair, read, evidence, full, custody):
              phase('fixture046_registration', 'registration', 'runner_original')
              registration = pair(evidence / 'fixture046-runtime.json', full / 'fixture046-runtime.json')
              ci.fixture046_runtime_receipt(registration)
              with RuntimeSupply(ci) as supply:
                  root = RUNTIME_ROOT
                  ownership = supply_pair(ci, supply, root / 'ownership.json',
                                          full / 'fixture046-runtime/ownership.json', custody, ci.ci_dir())
                  cleanup = supply_pair(ci, supply, root / 'cleanup.json',
                                        full / 'fixture046-runtime/cleanup.json', custody, ci.ci_dir())
                  phase('fixture046_settlement')
                  settled_supply(ownership, cleanup, registration)
                  supply.settled = True
                  for name in ci.FIXTURE046_SUPPLY_FILES:
                      supply_pair(ci, supply, root / name, full / 'fixture046-runtime' / name,
                                  custody, ci.ci_dir(), ci.JSON_LIMIT * 16, name.endswith('.json'))
                  # Settlement bytes and identities remain admitted; terminal reopens ALL leaves.
                  require(strict_json(supply.read(root / 'ownership.json')) == ownership
                          and strict_json(supply.read(root / 'cleanup.json')) == cleanup,
                          'supply_original_changed')
                  supply.terminal()
              phase('fixture046_custody')
              return {'docker_originals': sorted(DOCKER_ORIGINALS),
                      'runner_originals': sorted(SUPPLY_NAMES - DOCKER_ORIGINALS),
                      'expected_uid_roles': {'docker_original': 'root', 'runner_original': 'runner',
                                             'runner_retained': 'runner'},
                      'roles_distinct': True, 'settlement_verified': True,
                      'terminal_identity_verified': True}


          SOURCE_PINS = {'test/integration/connected-fixture105.test.ts': 'd94a78b2340848d156cd4f634926e12378a8e868876b99c2a7ed649111f4577a', 'src/runtime/connected-fixture105.ts': '02f6b14225ca4b69c150fdce060a4b91cfc507cc4f69a38764a566e8bd31918d', 'test/support/command-postgres-hosted.ts': 'f091c648c397b667c9134ed6fa412726879440bf90046e507ee1a00ad2d5c623', 'test/support/p33-parity-supervisor.py': '5e84ed89f47b86434011b8fc204c5383628a7a2f6f53377f39b5636f59fea495', 'test/support/p33-parity-runner.ts': '44bb370ca659d5d585af88f51e3ec6678356572b723816498fc6c16165c49858'}


          def main():
              # No fallback writes: admit the fixed verdict parent and Actions output first.
              phase('startup')
              output_owner = None
              try:
                  ci = load_ci()
                  owner = ci.installation_owner()
                  output_owner = owner.Owned()
                  parent = ci.ci_dir() / 'evidence'
                  parent_fd = output_owner.open(parent, True)
                  info = os.fstat(parent_fd)
                  require(stat.S_ISDIR(info.st_mode) and info.st_uid == os.getuid()
                          and stat.S_IMODE(info.st_mode) == 0o700, 'internal_verification_failure')
                  parent_identity = owner.metadata(info)[:5]
                  output = output_owner.open(Path(os.environ['GITHUB_OUTPUT']).parent, True)
                  output_fd = output_owner.open(Path(os.environ['GITHUB_OUTPUT']).name,
                      flags=os.O_WRONLY | os.O_APPEND | os.O_NOFOLLOW | os.O_NONBLOCK, parent=output)
                  metadata = os.fstat(output_fd)
                  require(stat.S_ISREG(metadata.st_mode) and metadata.st_uid == os.getuid()
                          and metadata.st_nlink == 1 and metadata.st_size <= 65536
                          and metadata.st_mode & 0o022 == 0, 'internal_verification_failure')
              except BaseException as error:
                  if output_owner is not None:
                      try:
                          output_owner.finish(error)
                      except BaseException:
                          pass
                  emit_failure(error)
                  return 1
              failure = None
              try:
                  try:
                      value = verify(ci)
                  except Exception as error:
                      failure = error
                      value = failure_record(error)
                  data = (json.dumps(value, sort_keys=True, separators=(',', ':'), allow_nan=False) + '\n').encode()
                  require(len(data) <= 262144, 'internal_verification_failure')
                  # Re-admit canonical output parent; write relative to the admitted descriptor.
                  fresh = output_owner.open(parent, True)
                  require(owner.metadata(os.fstat(fresh))[:5] == parent_identity,
                          'internal_verification_failure')
                  output_owner.close(fresh)
                  verdict_fd = output_owner.open('maintenance-diagnostic-verdict.json',
                      flags=os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, parent=parent_fd)
                  verdict_info = os.fstat(verdict_fd)
                  require(stat.S_ISREG(verdict_info.st_mode) and verdict_info.st_uid == os.getuid()
                          and verdict_info.st_nlink == 1 and stat.S_IMODE(verdict_info.st_mode) == 0o600,
                          'internal_verification_failure')
                  offset = 0
                  while offset < len(data):
                      count = os.write(verdict_fd, data[offset:])
                      require(count > 0, 'internal_verification_failure')
                      offset += count
                  os.fsync(verdict_fd)
                  output_owner.close(verdict_fd)
                  os.fsync(parent_fd)
                  fresh = output_owner.open(parent, True)
                  require(owner.metadata(os.fstat(fresh))[:5] == parent_identity,
                          'internal_verification_failure')
                  output_owner.close(fresh)
                  output_owner.close(parent_fd)
                  output_owner.close(output)
                  require(os.write(output_fd, b'verdict_written=true\n') == 21, 'internal_verification_failure')
                  output_owner.finish()
                  print(json.dumps({'schema': value['schema'], 'diagnostic_only': True,
                                    'native_passed': value['native_passed'], 'full_acceptance': False}))
              except BaseException as error:
                  try:
                      output_owner.finish(error)
                  except BaseException:
                      pass
                  emit_failure(error)
                  return 1
              return 1 if failure is not None else 0


          if __name__ == '__main__':
