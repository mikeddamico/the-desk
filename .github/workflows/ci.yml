name: foundation-ci

# REPRESENTATIVE FIRST: two independent ordinary installations and transferred-build provenance.
# Writer, aggregate, image and full acceptance remain HOLD; no additional run is dispatched.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-writer:
    if: ${{ false }} # Representative-first route; no writer run.
    runs-on: ubuntu-24.04
    timeout-minutes: 190
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: the_desk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d the_desk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    outputs:
      proof: ${{ steps.final.outputs.proof }}
    env:
      DESK_CI_PARTITION: writer
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/the_desk_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 2
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm install --global npm@11.19.0 --ignore-scripts
        working-directory: ${{ github.workspace }}
        timeout-minutes: 3
      - name: Prepare the exclusive complete BUILD clone
        id: build-layout
        if: ${{ success() }}
        working-directory: ${{ github.workspace }}
        timeout-minutes: 6
        run: |
          /usr/bin/timeout --signal=TERM --kill-after=20s 300s /usr/bin/python3 -I -B test/support/fixture105-hosted-layout.py build
      - name: Retain BUILD layout and failed preparation evidence
        id: upload-build-layout
        if: ${{ always() && steps.build-layout.outputs.evidence_claimed == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 2
        with:
          name: ci-build-layout-writer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build/fixture105-layout
          if-no-files-found: error
          retention-days: 30
      - name: Ordinary full BUILD install and five complete quality gates
        id: build-quality
        if: ${{ success() && steps.build-layout.outcome == 'success' }}
        working-directory: /tmp/d
        timeout-minutes: 41
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/build
        run: |
          /bin/bash tools/ci-validation/run-stage.sh producer-build
      - name: Prepare the exclusive complete EVAL clone
        id: eval-layout
        if: ${{ success() && steps.build-quality.outcome == 'success' }}
        working-directory: ${{ github.workspace }}
        timeout-minutes: 6
        run: |
          /usr/bin/timeout --signal=TERM --kill-after=20s 300s /usr/bin/python3 -I -B test/support/fixture105-hosted-layout.py evaluation
      - name: Retain EVAL layout and failed preparation evidence
        id: upload-eval-layout
        if: ${{ always() && steps.eval-layout.outputs.evidence_claimed == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 2
        with:
          name: ci-evaluation-layout-writer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evaluation/fixture105-layout
          if-no-files-found: error
          retention-days: 30
      - name: Ordinary EVAL install and closed preseal initialization
        id: eval-init
        if: ${{ success() && steps.eval-layout.outcome == 'success' }}
        working-directory: /tmp/e
        timeout-minutes: 16
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/evaluation
        run: |
          /bin/bash tools/ci-validation/run-stage.sh evaluation-init
      - name: Transfer complete verified dist and seal the evaluation provenance
        id: init
        if: ${{ success() && steps.eval-init.outcome == 'success' }}
        working-directory: /tmp/e
        timeout-minutes: 6
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/evaluation
        run: |
          /bin/bash tools/ci-validation/run-stage.sh bind-build
      - name: Verify all six frozen semantic identities in the genuine EVAL installation
        id: semantic-identities
        if: ${{ success() && steps.init.outcome == 'success' }}
        working-directory: /tmp/e
        timeout-minutes: 2
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/evaluation
        run: /usr/bin/python3 -I -B tools/ci-validation/ci.py identity-witness
      - name: Probe the disposable database read-only
        if: ${{ success() && steps.init.outcome == 'success' }}
        working-directory: /tmp/e
        timeout-minutes: 1
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/evaluation
        run: |
          /usr/bin/python3 -I -B tools/ci-validation/ci.py dbprobe
      - name: Guard P33 prerequisite
        if: ${{ success() && steps.init.outcome == 'success' }}
        working-directory: /tmp/e
        timeout-minutes: 1
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/evaluation
        run: |
          /bin/bash tools/ci-validation/run-stage.sh prerequisite
      - name: Validate P33 prerequisite
        if: ${{ success() && steps.init.outcome == 'success' }}
        working-directory: /tmp/e
        timeout-minutes: 1
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/evaluation
        run: |
          /usr/bin/python3 -I -B tools/ci-validation/ci.py check prerequisite
      - name: Guard P33 focused
        if: ${{ success() && steps.init.outcome == 'success' }}
        working-directory: /tmp/e
        timeout-minutes: 3
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/evaluation
        run: |
          /bin/bash tools/ci-validation/run-stage.sh focused
      - name: Validate P33 focused
        if: ${{ success() && steps.init.outcome == 'success' }}
        working-directory: /tmp/e
        timeout-minutes: 1
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/evaluation
        run: |
          /usr/bin/python3 -I -B tools/ci-validation/ci.py check focused
      - name: Collect controls evidence
        id: collect-controls
        if: ${{ always() && steps.init.outcome == 'success' }}
        working-directory: /tmp/e
        timeout-minutes: 2
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/evaluation
        run: |
          /usr/bin/python3 -I -B tools/ci-validation/ci.py collect --scope controls
      - name: Retain controls evidence
        id: upload-controls
        if: ${{ always() && steps.collect-controls.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 2
        with:
          name: ci-controls-writer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evaluation/ci/upload-controls
          if-no-files-found: error
          retention-days: 30
      - name: Guard P33 aggregate all (held)
        if: ${{ false }}
        working-directory: /tmp/e
        timeout-minutes: 122
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/evaluation
        run: |
          /bin/bash tools/ci-validation/run-stage.sh all
      - name: Validate aggregate counts coverage and source (held)
        if: ${{ false }}
        working-directory: /tmp/e
        timeout-minutes: 2
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/evaluation
        run: |
          /usr/bin/python3 -I -B tools/ci-validation/ci.py check all
      - name: Collect full evidence
        id: collect-full
        if: ${{ always() && steps.init.outcome == 'success' }}
        working-directory: /tmp/e
        timeout-minutes: 3
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/evaluation
        run: |
          /usr/bin/python3 -I -B tools/ci-validation/ci.py collect --scope full
      - name: Retain full evidence
        id: upload-full
        if: ${{ always() && steps.collect-full.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 3
        with:
          name: ci-full-writer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evaluation/ci/upload-full
          if-no-files-found: error
          retention-days: 30
      - name: Collect known producer failure or partial evidence
        id: collect-producer
        if: ${{ always() && steps.build-layout.outcome != 'skipped' }}
        working-directory: ${{ github.workspace }}
        timeout-minutes: 3
        run: |
          /usr/bin/python3 -I -B tools/ci-validation/ci.py retain-producer-partial
      - name: Retain both producer roles including partial failures
        id: upload-producer
        if: ${{ always() && steps.collect-producer.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 3
        with:
          name: ci-producers-writer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/producer-failure
          if-no-files-found: error
          retention-days: 30
      - name: Audit (held until full-validation release)
        id: audit
        if: ${{ false }}
        working-directory: /tmp/d
        timeout-minutes: 5
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/build
        run: |
          npm audit --audit-level=high
      - id: gitleaks
        if: ${{ false }} # Full-validation gate remains held, not removed.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: Retain security report (held)
        id: retain-security
        if: ${{ false }}
        working-directory: /tmp/e
        timeout-minutes: 1
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/evaluation
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
        run: |
          /usr/bin/python3 -I -B tools/ci-validation/ci.py retain-security
      - name: Upload partition security report (held)
        id: upload-security
        if: ${{ false }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 2
        with:
          name: ci-security-writer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evaluation/ci/security-report
          if-no-files-found: error
          retention-days: 30
      - name: HOLD original representative cannot qualify for full CI
        id: final
        if: ${{ always() && steps.build-layout.outcome != 'skipped' }}
        working-directory: ${{ github.workspace }}
        timeout-minutes: 3
        env:
          PRODUCER_UPLOAD_OUTCOME: ${{ steps.upload-producer.outcome }}
          NATIVE_OUTCOME: ${{ steps.command-postgres.outcome }}
          NATIVE_UPLOAD_OUTCOME: ${{ steps.upload-native.outcome }}
          CONTROLS_UPLOAD_OUTCOME: ${{ steps.upload-controls.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload-full.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
          SECURITY_UPLOAD_OUTCOME: ${{ steps.upload-security.outcome }}
        run: |
          /usr/bin/python3 -I -B tools/ci-validation/ci.py diagnostic-final

  verify-rest:
    runs-on: ubuntu-24.04
    timeout-minutes: 190
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: the_desk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d the_desk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    outputs:
      proof: ${{ steps.final.outputs.proof }}
    env:
      DESK_CI_PARTITION: rest
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/the_desk_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 2
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm install --global npm@11.19.0 --ignore-scripts
        working-directory: ${{ github.workspace }}
        timeout-minutes: 3
      - name: Prepare the exclusive complete BUILD clone
        id: build-layout
        if: ${{ success() }}
        working-directory: ${{ github.workspace }}
        timeout-minutes: 6
        run: |
          /usr/bin/timeout --signal=TERM --kill-after=20s 300s /usr/bin/python3 -I -B test/support/fixture105-hosted-layout.py build
      - name: Retain BUILD layout and failed preparation evidence
        id: upload-build-layout
        if: ${{ always() && steps.build-layout.outputs.evidence_claimed == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 2
        with:
          name: ci-build-layout-rest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build/fixture105-layout
          if-no-files-found: error
          retention-days: 30
      - name: Ordinary full BUILD install and five complete quality gates
        id: build-quality
        if: ${{ success() && steps.build-layout.outcome == 'success' }}
        working-directory: /tmp/d
        timeout-minutes: 41
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/build
        run: |
          /bin/bash tools/ci-validation/run-stage.sh producer-build
      - name: Prepare the exclusive complete EVAL clone
        id: eval-layout
        if: ${{ success() && steps.build-quality.outcome == 'success' }}
        working-directory: ${{ github.workspace }}
        timeout-minutes: 6
        run: |
          /usr/bin/timeout --signal=TERM --kill-after=20s 300s /usr/bin/python3 -I -B test/support/fixture105-hosted-layout.py evaluation
      - name: Retain EVAL layout and failed preparation evidence
        id: upload-eval-layout
        if: ${{ always() && steps.eval-layout.outputs.evidence_claimed == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 2
        with:
          name: ci-evaluation-layout-rest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evaluation/fixture105-layout
          if-no-files-found: error
          retention-days: 30
      - name: Ordinary EVAL install and closed preseal initialization
        id: eval-init
        if: ${{ success() && steps.eval-layout.outcome == 'success' }}
        working-directory: /tmp/e
        timeout-minutes: 16
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/evaluation
        run: |
          /bin/bash tools/ci-validation/run-stage.sh evaluation-init
      - name: Transfer complete verified dist and seal the evaluation provenance
        id: init
        if: ${{ success() && steps.eval-init.outcome == 'success' }}
        working-directory: /tmp/e
        timeout-minutes: 6
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/evaluation
        run: |
          /bin/bash tools/ci-validation/run-stage.sh bind-build
      - name: Reconstruct the fixed synthetic fixture FFmpeg runtime (held)
        id: fixture046-runtime
        if: ${{ false }} # Representative-first route; no media preparation.
        working-directory: /tmp/e
        timeout-minutes: 16
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/evaluation
        run: /usr/bin/timeout --signal=TERM --kill-after=20s 900s /usr/bin/python3 -I -B test/support/fixture046-ffmpeg-supply.py prepare
      - name: Verify all six frozen semantic identities in the genuine EVAL installation
        id: semantic-identities
        if: ${{ success() && steps.init.outcome == 'success' }}
        working-directory: /tmp/e
        timeout-minutes: 2
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/evaluation
        run: /usr/bin/python3 -I -B tools/ci-validation/ci.py identity-witness
      - name: Prove traversal17 Node12 and callback20 after genuine seal
        id: traversal-proof
        if: ${{ false }} # Native tranche uses fresh focused receipts; traversal is already proved.
        working-directory: /tmp/e
        timeout-minutes: 21
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/evaluation
        run: |
          /usr/bin/timeout --signal=TERM --kill-after=20s 1200s /usr/bin/python3 -I -B tools/ci-validation/ci.py traversal-proof
      - name: Retain traversal proof including failed capture and loader evidence
        id: upload-traversal
        if: ${{ false }} # No traversal attempt in the native tranche.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 3
        with:
          name: ci-fixture105-traversal-rest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/evaluation/ci/evidence/fixture105-traversal
            ${{ runner.temp }}/evaluation/ci/evidence/fixture105-before-focused.json
            ${{ runner.temp }}/evaluation/ci/evidence/fixture105-loader-created.json
            ${{ runner.temp }}/evaluation/ci/tmp/capture-fixture105-traversal
          if-no-files-found: error
          retention-days: 30
      - name: Probe the disposable database read-only
        if: ${{ success() && steps.init.outcome == 'success' && steps.semantic-identities.outcome == 'success' }}
        working-directory: /tmp/e
        timeout-minutes: 1
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/evaluation
        run: |
          /usr/bin/python3 -I -B tools/ci-validation/ci.py dbprobe
      - name: Guard P33 prerequisite
        if: ${{ success() && steps.init.outcome == 'success' && steps.semantic-identities.outcome == 'success' }}
        working-directory: /tmp/e
        timeout-minutes: 1
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/evaluation
        run: |
          /bin/bash tools/ci-validation/run-stage.sh prerequisite
      - name: Validate P33 prerequisite
        if: ${{ success() && steps.init.outcome == 'success' && steps.semantic-identities.outcome == 'success' }}
        working-directory: /tmp/e
        timeout-minutes: 1
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/evaluation
        run: |
          /usr/bin/python3 -I -B tools/ci-validation/ci.py check prerequisite
      - name: Guard P33 focused
        if: ${{ success() && steps.init.outcome == 'success' && steps.semantic-identities.outcome == 'success' }}
        working-directory: /tmp/e
        timeout-minutes: 3
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/evaluation
        run: |
          /bin/bash tools/ci-validation/run-stage.sh focused
      - name: Validate P33 focused
        if: ${{ success() && steps.init.outcome == 'success' && steps.semantic-identities.outcome == 'success' }}
        working-directory: /tmp/e
        timeout-minutes: 1
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/evaluation
        run: |
          /usr/bin/python3 -I -B tools/ci-validation/ci.py check focused
      - name: Collect controls evidence
        id: collect-controls
        if: ${{ always() && steps.init.outcome == 'success' }}
        working-directory: /tmp/e
        timeout-minutes: 2
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/evaluation
        run: |
          /usr/bin/python3 -I -B tools/ci-validation/ci.py collect --scope controls
      - name: Retain controls evidence
        id: upload-controls
        if: ${{ always() && steps.collect-controls.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 2
        with:
          name: ci-controls-rest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evaluation/ci/upload-controls
          if-no-files-found: error
          retention-days: 30
      - name: Diagnose the original fixed four-owner native case
        id: command-postgres
        if: ${{ success() && steps.init.outcome == 'success' && steps.semantic-identities.outcome == 'success' && steps.collect-controls.outcome == 'success' && steps.upload-controls.outcome == 'success' }}
        working-directory: /tmp/e
        timeout-minutes: 21
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/evaluation
        run: |
          /usr/bin/env HOME="$DESK_CI_ROLE_TEMP/ci/home" TMPDIR="$DESK_CI_ROLE_TEMP/ci/tmp" \
            /usr/bin/timeout --signal=TERM --kill-after=20s 1200s \
            node --import tsx test/support/command-postgres-hosted.ts fixture105-unknown
      - name: Retain native diagnostic including failed cleanup observations
        id: upload-native
        if: ${{ always() && steps.init.outcome == 'success' && steps.command-postgres.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 2
        with:
          name: ci-fixture105-unknown-rest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evaluation/ci/evidence/fixture105-unknown/retained
          if-no-files-found: error
          retention-days: 30
      - name: Guard P33 aggregate all (held)
        if: ${{ false }}
        working-directory: /tmp/e
        timeout-minutes: 122
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/evaluation
        run: |
          /bin/bash tools/ci-validation/run-stage.sh all
      - name: Validate aggregate counts coverage and source (held)
        if: ${{ false }}
        working-directory: /tmp/e
        timeout-minutes: 2
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/evaluation
        run: |
          /usr/bin/python3 -I -B tools/ci-validation/ci.py check all
      - name: Settle owned fixture runtime before full retention
        id: fixture046-cleanup
        if: ${{ always() && steps.init.outcome == 'success' && (steps.fixture046-runtime.outcome == 'success' || steps.fixture046-runtime.outcome == 'failure') }}
        working-directory: /tmp/e
        timeout-minutes: 2
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/evaluation
        run: /usr/bin/python3 -I -B test/support/fixture046-ffmpeg-supply.py cleanup
      - name: Collect full evidence
        id: collect-full
        if: ${{ false }} # Traversal-only first tranche; restore all prerequisites in fresh roles later.
        working-directory: /tmp/e
        timeout-minutes: 3
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/evaluation
          FIXTURE046_CLEANUP_OUTCOME: ${{ steps.fixture046-cleanup.outcome }}
        run: |
          /usr/bin/python3 -I -B tools/ci-validation/ci.py collect --scope full
      - name: Retain full evidence
        id: upload-full
        if: ${{ false }} # Traversal-only first tranche; restore all prerequisites in fresh roles later.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 3
        with:
          name: ci-full-rest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evaluation/ci/upload-full
          if-no-files-found: error
          retention-days: 30
      - name: Collect known producer failure or partial evidence
        id: collect-producer
        if: ${{ always() && steps.build-layout.outcome != 'skipped' }}
        working-directory: ${{ github.workspace }}
        timeout-minutes: 3
        run: |
          /usr/bin/python3 -I -B tools/ci-validation/ci.py retain-producer-partial
      - name: Retain both producer roles including partial failures
        id: upload-producer
        if: ${{ always() && steps.collect-producer.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 3
        with:
          name: ci-producers-rest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/producer-failure
          if-no-files-found: error
          retention-days: 30
      - name: Audit (held until full-validation release)
        id: audit
        if: ${{ false }}
        working-directory: /tmp/d
        timeout-minutes: 5
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/build
        run: |
          npm audit --audit-level=high
      - id: gitleaks
        if: ${{ false }} # Full-validation gate remains held, not removed.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: Retain security report (held)
        id: retain-security
        if: ${{ false }}
        working-directory: /tmp/e
        timeout-minutes: 1
        env:
          DESK_CI_ROLE_TEMP: ${{ runner.temp }}/evaluation
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
        run: |
          /usr/bin/python3 -I -B tools/ci-validation/ci.py retain-security
      - name: Upload partition security report (held)
        id: upload-security
        if: ${{ false }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 2
        with:
          name: ci-security-rest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evaluation/ci/security-report
          if-no-files-found: error
          retention-days: 30
      - name: HOLD original representative cannot qualify for full CI
        id: final
        if: ${{ always() && steps.build-layout.outcome != 'skipped' }}
        working-directory: ${{ github.workspace }}
        timeout-minutes: 3
        env:
          PRODUCER_UPLOAD_OUTCOME: ${{ steps.upload-producer.outcome }}
          NATIVE_OUTCOME: ${{ steps.command-postgres.outcome }}
          NATIVE_UPLOAD_OUTCOME: ${{ steps.upload-native.outcome }}
          CONTROLS_UPLOAD_OUTCOME: ${{ steps.upload-controls.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload-full.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
          SECURITY_UPLOAD_OUTCOME: ${{ steps.upload-security.outcome }}
          FIXTURE046_CLEANUP_OUTCOME: ${{ steps.fixture046-cleanup.outcome }}
        run: |
          /usr/bin/python3 -I -B tools/ci-validation/ci.py diagnostic-final

  verify:
    needs: [verify-writer, verify-rest, container]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every isolated job
        env:
          WRITER_OUTCOME: ${{ needs.verify-writer.result }}
          REST_OUTCOME: ${{ needs.verify-rest.result }}
          CONTAINER_OUTCOME: ${{ needs.container.result }}
        run: |
          test "$WRITER_OUTCOME" = success
          test "$REST_OUTCOME" = success
          test "$CONTAINER_OUTCOME" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with: { fetch-depth: 0 }
      - name: Prove the complete disjoint test population
        run: /usr/bin/python3 -I -B tools/ci-validation/ci.py joint
        timeout-minutes: 2
        env:
          WRITER_PROOF: ${{ needs.verify-writer.outputs.proof }}
          REST_PROOF: ${{ needs.verify-rest.outputs.proof }}
          WRITER_OUTCOME: ${{ needs.verify-writer.result }}
          REST_OUTCOME: ${{ needs.verify-rest.result }}
          CONTAINER_OUTCOME: ${{ needs.container.result }}

  container:
    if: ${{ false }} # Native diagnostic: no image build.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
      - run: docker build --tag the-desk:${GITHUB_SHA} --build-arg DEPLOYED_COMMIT=${GITHUB_SHA} .
        timeout-minutes: 25
