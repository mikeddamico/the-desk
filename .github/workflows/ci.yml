              finally:
                  os.close(fd)
              need(error is None, 'case')
              need(time.monotonic() < probe.deadline, 'deadline')
              return receipt


          def preflight(base, workspace, service):
              interruption = {'cancelled': False, 'cleaning': False}
              def stop(signum, frame):
                  interruption['cancelled'] = True
                  if not interruption['cleaning']:
                      raise PreflightFailure('command_uncertain')
              previous = {}
              try:
                  for signum in (signal.SIGTERM, signal.SIGINT):
                      previous[signum] = signal.signal(signum, stop)
                  result = preflight_body(base, workspace, service, interruption)
                  need(not interruption['cancelled'], 'command_uncertain')
                  return result
              finally:
                  for signum, handler in previous.items():
                      signal.signal(signum, handler)

          PINS = {'tools/ci-validation/test_installation.py': '8824a10b4dad96249397632fd95461f2222a92a0064854afa4556124548bfb1d', 'tools/ci-validation/ci.py': 'fb83752ba37e400391b95fde6ad15625aba9eb878ccc00bc71a20645a23e0638', 'tools/ci-validation/installation.py': '3a00fe9ff11f3363bfe2f70dae56129282815845bc0c974cec4573278b05cfd0', 'tools/ci-validation/installation_model.py': '49ed8a122c20d1b831b9d615f9ba45b8808befb7403085ec0c344ceec90c5619', 'test/support/p33-parity-supervisor.py': '5e84ed89f47b86434011b8fc204c5383628a7a2f6f53377f39b5636f59fea495'}
