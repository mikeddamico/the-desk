name: pr28-parity-boundary-diagnostic

on:
  push:
    branches: [diagnostic/pr28-parity-boundary-001]

permissions:
  contents: read

jobs:
  parity-only:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - run: npm install --global npm@11.19.0 --ignore-scripts
        timeout-minutes: 3
      - run: npm ci --ignore-scripts --no-audit --no-fund
        timeout-minutes: 3
      - name: Record environment without extraction
        run: /usr/bin/python3 tools/parity-boundary/versions.py
        timeout-minutes: 1
      - name: One bounded parity-only observation
        run: /usr/bin/python3 tools/parity-boundary/controller.py --released-run-id parity-hosted-001 --manifest-sha256 8bdf2c5e21e4a0c04a624b1a41994b98ee8821cd4f30bf21330c11cac12eabbf
        timeout-minutes: 12
      - name: Retain diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr28-parity-boundary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .parity-boundary-versions.json
            .parity-boundary-evidence/*.json
            .parity-boundary-evidence/output.log
            .parity-boundary-evidence/archives/**
            .parity-boundary-evidence/p33/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
